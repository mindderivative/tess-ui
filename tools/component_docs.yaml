# What the component pages say, by hand: the one thing in them a tool can't read from the code.
# `tools/generate_component_docs.py` adds each view's TDL and its stylesheet, and the parts and
# parameters, from the files themselves.
#
# groups:        the collapsing tree, in order.
# components:    one page each: slug, title, group, views (the shipped views it is built from), widgets (the
#                built-in widgets), md3 (what it is in Material Design 3), built (how Tesserae makes it),
#                usage_view (an example in a view), python (the same in code), shares, see (guide pages).
groups:
  - Actions
  - Communication
  - Containment
  - Navigation
  - Selection and input
  - Content
  - Beyond MD3
  - Windows and docking

components:
  # -- Actions -----------------------------------------------------------------------------------
  - slug: buttons
    title: Buttons
    group: Actions
    views: [Button]
    md3: |
      Buttons let people take an action with one tap. Material Design 3 has five, in order of emphasis: **filled**
      for a screen's one main action, **filled tonal** and **elevated** for important but secondary ones,
      **outlined** for medium emphasis, and **text** for the lowest: dialogs, cards and toolbars. A button is 40dp
      high and fully rounded, and its label is in the *label large* type style.
    built: |
      `Button` is a view Tesserae ships (`Button_View.tdl` and `Button_Stylesheet.tdl`). One widget has all five types, in five sizes. It is as wide
      as its label and icons, and `Handlers { On_Click: ... }` on the call is what a press does; Enter or Space on a focused button does the same.

      A toggle (`Toggle: true`) flips `Selected` on each press, and its colours and shape swap while it is on; with `Flip: false` the caller decides when it flips
      (a button group's buttons are made so). While `Loading` a spinner takes the icon's place and the button does not respond. A disabled button fades as a whole.

      The label is `label_large` at `xs` and `s`, `title_medium` at `m`, `headline_small` at `l` and `headline_large` at `xl`; the gap between the parts is 4, 8, 8, 12 and 16 pixels. Padding
      at the default size is 24 pixels each side (16 on the side with an icon, or the spinner; a text button 12); `xs` has 12, `m` 24, `l` 48 and `xl` 64 whatever is in the button.
      The container is a pill and, while pressed, squares off; a toggle that is
      on takes the other shape. A filled or tonal button lifts to level 1 when hovered, an elevated one rests at level 1 and lifts to 2. The state layer, ripple and
      focus ring are the node's interaction. The look is in the stylesheet: write a `Button_Stylesheet.tdl` in your project to change it. Not built: the
      container colour at 12% for a disabled filled button (a disabled button fades as a whole).
    usage_view: |
      Container {
        Name: actions
        Style { Flex_Direction: horizontal, Gap: 12, Padding: 16, Align_Content: center }
        Children {
          Button {
            Label: Save
            Icon: home
            Handlers {
              On_Click: save
            }
          }
          Button {
            Label: Draft
            Variant: outlined
          }
          Button {
            Label: Mute
            Variant: tonal
            Toggle: true
            Selected: <| muted |>
          }
          Button {
            Label: Sync
            Variant: text
            Loading: <| syncing |>
          }
        }
      }
    python: |
      from tess_ui.widgets import button

      save = button(app.window, "Save", 120, 40, variant="filled", on_click=viewmodel.save)
    see: [guide/widget-catalog.md, guide/interaction.md]

  - slug: button-groups
    title: Button groups
    group: Actions
    views: [ButtonGroup]
    md3: |
      A button group lays related buttons side by side, with an even gap, so they read as one set of choices.
    built: |
      `ButtonGroup` is a view Tesserae ships (`ButtonGroup_View.tdl`): `Button`s side by side, one for each of `Items`.

      The `Mode` says what the buttons are: `none` (the default) is a row of actions, and the value of the one last pressed goes to `Chosen` (nothing needs to be bound);
      `single` is a choice of one, with `Selected` its value; `multiple` is a set, with `Selected` the list of chosen values. Each item is `{Value, Label}` and optionally
      `{Icon, Disabled}`. `Variant` and `Size` are `Button`'s and go to every button. By default the buttons stand 8 pixels apart; `Connected: true` makes the gap 2
      pixels with 4 pixel inner corners, and `Orientation: vertical` makes a column.

      In `single` mode a chosen button is a toggle that is on, and the arrow keys move the choice; `multiple` toggles each button and the arrows only move the
      focus. There is one Tab stop. Not built: the pressed button widening and its neighbours giving way, and an overflow button.
    usage_view: |
      Container {
        Name: calendar
        Style { Flex_Direction: vertical, Gap: 12, Padding: 16, Width: 360, Height: 160 }
        Children {
          ButtonGroup {
            Mode: single
            Connected: true
            Variant: tonal
            Selected: <| range |>
            Items {
              Item { Value: day, Label: Day }
              Item { Value: week, Label: Week }
              Item { Value: month, Label: Month }
            }
          }
          ButtonGroup {
            Chosen: <| last_action |>
            Items {
              Item { Value: copy, Label: Copy, Icon: home }
              Item { Value: paste, Label: Paste }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import button_group

      group = button_group(app.window, ["Day", "Week", "Month"], 90, 40, on_click=viewmodel.pick)

  - slug: split-buttons
    title: Split buttons
    group: Actions
    views: [SplitButton]
    md3: |
      A split button joins a main action to a menu of related ones: the leading part does the usual thing, and the
      trailing chevron opens the others.
    built: |
      `SplitButton` is a view Tesserae ships (`SplitButton_View.tdl`): two `Button`s 2 pixels apart and a `Menu` for the trailing one. One widget covers all five types.

      The main part has the `Label` and an optional `Icon` and runs `On_Click`; the trailing part opens a `Menu` of `Items` (rows as `Menu` takes them), and the `Value`
      of the row pressed goes to `Chosen`. `Variant` and `Size` are `Button`'s and both parts take them.

      The inner corners are small (4 pixels) and the outer ones round; while the menu is open the trailing part is round on every corner and its chevron is turned over. Each part is its
      own Tab stop; the trailing part says it is expanded while its menu shows. Arrow-down on either part opens the menu and moves the focus to its first row (a press opens it
      without moving the focus). Not built: a toggle form.
    usage_view: |
      Container {
        Name: compose
        Style { Width: 420, Height: 240, Padding: 16 }
        Children {
          SplitButton {
            Label: Send
            Icon: send
            On_Click: send_now
            Chosen: <| when |>
            Items {
              Item { Value: later, Label: "Send later" }
              Item { Value: draft, Label: "Save as draft" }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import split_button

      send = split_button(app.window, "Send", 160, 40, variant="filled")

  - slug: icon-buttons
    title: Icon buttons
    group: Actions
    views: [IconButton]
    md3: |
      An icon button is an action shown as a glyph alone. Like buttons it has four emphases: standard (no
      container), filled, filled tonal and outlined. It is 40dp, with a 48dp touch target.
    built: |
      `IconButton` is a view Tesserae ships (`IconButton_View.tdl`): one widget for the four types, in five sizes and three widths. The `Label`
      names it for a screen reader and is its tooltip. `Handlers { On_Click: ... }` on the call is what a press does.

      The glyph is 20, 24, 24, 32 or 40 pixels for the five sizes. `Width_Kind` makes it as wide as it is tall (`default`), or narrower or wider (a 40 pixel button is 32
      pixels wide when `narrow` and 52 when `wide`). A toggle (`Toggle: true`) flips `Selected` on a press, and the `Selected_Icon`, the colours and the shape show while it is on. The
      glyph morphs into the other over 200 ms when the two are both closed shapes or both open lines (`add` and `remove` do); other pairs, such as `play` and `pause`, switch partway through
      instead. `Tint` sets a standard button's icon colour to a colour role. A button with a `Label` shows it as a tooltip, and without one there is no tooltip.

      The state layer, ripple and focus ring are the node's interaction; a pressed circle squares off. Not built: the 12% container of a disabled filled
      button, and the 48 pixel touch target around a 40 pixel button.
    usage_view: |
      Container {
        Name: toolbar
        Style { Flex_Direction: horizontal, Gap: 8, Padding: 16 }
        Children {
          IconButton {
            Icon: settings
            Label: Settings
            Handlers {
              On_Click: open_settings
            }
          }
          IconButton {
            Icon: home
            Selected_Icon: search
            Label: Favourite
            Variant: filled
            Toggle: true
            Selected: <| favourite |>
          }
        }
      }
    python: |
      from tess_ui.widgets import icon_button

      settings = icon_button(app.window, "settings", 40, variant="standard")

  - slug: fabs
    title: Floating action buttons
    group: Actions
    views: [Fab]
    md3: |
      A floating action button (FAB) is the screen's most important action, as an icon in a prominent container.
      There are four colours (primary, secondary, tertiary and surface) and three sizes: small (40dp), the
      default (56dp) and large (96dp).
    built: |
      `Fab` is a view Tesserae ships (`Fab_View.tdl`): one widget for the four colours and three sizes, and for the extended form too (give it a
      `Label`).

      The glyph is 24 pixels, 36 on a large FAB, and the corners are 12, 16 and 28 pixels for the three sizes. A collapsed extended FAB shows only its icon, and its
      label becomes its tooltip; the label is also the accessible name.

      It rests at elevation level 3, lifts to 4 when hovered and settles to 3 when pressed. To collapse as a list scrolls down and extend as it scrolls up, bind
      `Collapsed: "<| way == 'down' |>"` to the `Scroll_Direction` of the list. Not built: easing the collapse and the extend (the width goes between a number and `auto`,
      which the engine does not animate, so the FAB changes shape at once), and the FAB menu.
    usage_view: |
      Container {
        Name: inbox
        Style { Flex_Direction: vertical, Width: 360, Height: 480 }
        Children {
          ScrollView {
            Scroll_Direction: <| way |>
            Style { Height: 400 }
            Children {
              Text {
                Text: Messages
                Typography_Role: body_medium
                Style { Foreground: on_surface }
              }
            }
          }
          Fab {
            Icon: add
            Label: Compose
            Collapsed: <| way == 'down' |>
            Handlers {
              On_Click: compose
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import fab

      add = fab(app.window, "add", size="default", variant="primary")

  - slug: extended-fabs
    title: Extended FABs
    group: Actions
    shares: fabs
    md3: |
      An extended FAB is a FAB with a text label, for a main action that an icon alone wouldn't explain.
    built: |
      It is the same `Fab` (see Floating action buttons) given a `Label`: 56 tall, as wide as its label, with 16 pixels before the icon and 20
      after the text. Give no `Icon` for a text-only one.
    usage_view: |
      Container {
        Name: inbox
        Style { Width: 240, Height: 120 }
        Children {
          Fab {
            Label: New
            Icon: add
            Variant: secondary
            Handlers {
              On_Click: create
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import extended_fab

      new = extended_fab(app.window, "New", 120, icon="add", variant="primary")

  # -- Communication -----------------------------------------------------------------------------
  - slug: badges
    title: Badges
    group: Communication
    views: [Badge]
    md3: |
      A badge shows that something has news. The small one is a dot, and the large one carries a short count or
      text. It sits on the corner of what it describes.
    built: |
      `Badge` is a view Tesserae ships (`Badge_View.tdl`) with its look as rules (`Badge_Stylesheet.tdl`): a 6 pixel `Error` dot, or with a
      `Value` a 16 pixel pill in `label_small` on `on_error`, at least 16 wide and growing with its text.

      A `Value` that is a number over `Limit` shows as the limit and a plus (`999+` by default), and `Show: "<| unread > 0 |>"` hides a zero count. With
      `Anchored: true` the children are the host, and the badge sits over the host's top right corner.

      Anchored, a dot overlaps the corner by 4 and a pill starts 12 in from the corner and 4 above it. The badge is hidden from a screen reader: put the
      count in the host's label ("Inbox, 3 unread"). The parts a stylesheet can address are `mark` and `label`.
    usage_view: |
      Container {
        Name: nav
        Style { Flex_Direction: horizontal, Gap: 24, Width: 200, Height: 60, Padding: 16 }
        Children {
          Badge {
            Value: <| unread |>
            Show: <| unread > 0 |>
            Anchored: true
            Children {
              Icon {
                Icon: email
                Style { Width: 24, Height: 24, Foreground: on_surface }
              }
            }
          }
          Badge {
            Anchored: true
            Children {
              Icon {
                Icon: home
                Style { Width: 24, Height: 24, Foreground: on_surface }
              }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import badge

      unread = badge(app.window, "3")

  - slug: progress-indicators
    title: Progress indicators
    group: Communication
    widgets: [LinearProgress, CircularProgress, LoadingIndicator]
    md3: |
      Progress indicators show that something is happening. **Determinate** ones fill as a value from 0 to 1
      grows; **indeterminate** ones keep moving when there's no value to show. The loading indicator is MD3's
      shape-morphing one, for short waits.
    built: |
      Each is a Tesserae control (`tess_ui.controls`), not a drawing of `tess_re`'s: `LinearProgress`, `CircularProgress` and
      `LoadingIndicator`. Leave `Value` out, or let an expression give nothing, for a wait with no end; a number from 0 to 1 is determinate and
      eases to each new value.

      A bar is 240 pixels long and 4 thick, and a ring is 48 across, unless the call's `Style:` gives a `Width`; the colour is `Style.Foreground`, `primary` by default. A bar
      has a `surface_container_highest` track behind it and a ring has none, until `Track` names a colour role; a stop dot at the end of the bar's track is opt-in
      (`Stop_Indicator`), as is a `Buffer` (how much has loaded, 0 to 1, a lighter bar behind the value). With a `Track`, a determinate ring and its track are a gap apart
      (4 pixels between the rounded ends), as in MD3. A `Wavy` bar is taller than its `Thickness` by the wave's height (6 pixels), and a wavy ring's arc is a wave round
      a plain track. A screen reader hears a progress bar with its value as a percentage, or as busy when there is none. An app that reduces motion gets a still bar and arc
      instead of the endless motion. The two bars of `Two_Bar` keep their widths as they cross, so the sweep approximates MD3's, whose bars grow and shrink; the wave's size
      and speed and the thicker sizes are written from memory of the spec and have not been checked against it.
    usage_view: |
      Container {
        Name: upload
        Style { Flex_Direction: vertical, Gap: 16, Width: 280, Height: 140, Padding: 16 }
        Children {
          LinearProgress {
            Value: <| sent |>
            Buffer: <| queued |>
            Label: Uploading
            Style { Width: 240 }
          }
          LinearProgress {  # no value: a wait with no end
            Style { Width: 240 }
          }
          CircularProgress {
            Value: <| sent |>
            Track: secondary_container
          }
          LinearProgress {
            Value: <| sent |>
            Wavy: true
            Thickness: 4
            Style { Width: 240 }
          }
        }
      }
    python: |
      from tess_ui.widgets import linear_progress

      upload = linear_progress(app.window, 240, value=0.4)
      upload.value.set(0.8)
    see: [guide/controls.md]

  - slug: snackbars
    title: Snackbars
    group: Communication
    views: [Snackbar, SnackbarHost]
    md3: |
      A snackbar briefly tells the user about a process that has happened or will happen, at the bottom of the
      window, and may offer one action. It goes away by itself.
    built: |
      Two views Tesserae ships: `Snackbar` (one message) and `SnackbarHost` (several, one after another).

      A `Snackbar` shows while `Open` is true and writes `false` back when it closes. It closes itself after `Duration` milliseconds (4000 by default; 0 keeps it until it is closed),
      and the pointer over it holds the time off. The `Action` is a text button after the message: pressing it runs `On_Action` and closes the snackbar. `Closable` adds a close
      button, and `On_Close` is called when it closes however it closes. It is 344 to 560 pixels wide (`Width`), 16 from the window's edge (`Margin`), at the start or `Centered`.

      It is `inverse_surface` at level 3 with 4 pixel corners, 48 pixels tall (68 for two lines), over the content, not modal, and takes no focus; a screen reader hears it
      as a polite alert. A `SnackbarHost` takes `Messages` (`{Message}` and optionally `{Action, Value, id, Duration}`), shows the first, drops it when it closes
      and shows the next; add to the list from anywhere that can write it; `Chosen` is the `Value` of the action pressed. An `Overlay` has a `Timeout`
      and an `on_dismiss` handler, which is how this is made. Not built: swipe to dismiss, and lifting above a FAB or a bottom bar.
    usage_view: |
      Container {
        Name: notes
        Style { Width: 480, Height: 320 }
        Children {
          SnackbarHost {
            Messages: <| toasts |>
            Chosen: <| undo |>
          }
          Snackbar {
            Open: <| saved |>
            Message: "Note saved"
            Action: Undo
            On_Action: undo_save
          }
        }
      }
    python: |
      from tess_ui.widgets import snackbar

      bar = snackbar(app.window, "Saved", 280, action_label="Undo", on_action=viewmodel.undo)
      bar.open()
    see: [guide/overlays.md]

  - slug: tooltips
    title: Tooltips
    group: Communication
    md3: |
      A tooltip names or explains a control when the pointer rests on it, or it has keyboard focus.
    built: |
      Any node takes a `Tooltip:`. A plain one is text on the inverse surface; a rich one has a `Title`, up to two `Actions` and a `Placement`
      (`below`, `above`, `start`, `end`, or a corner: `top_start`, `top_end`, `bottom_start`, `bottom_end`, `center`, which puts the middle of the tooltip on that point and is not flipped), is a raised surface the pointer can move onto, and closes when an action is pressed. It shows after the
      pointer rests for `delay` (500 ms by default), at once on keyboard focus (focus that a click gave does not count), or after a touch held in place; Escape, a press, or leaving
      closes it. The text also names the node for a screen reader, unless the node has a description of its own. Not built: reaching the actions by keyboard.
    usage_view: |
      Container {
        Name: file
        Style { Width: 240, Height: 120, Padding: 24 }
        Children {
          Button {
            Label: Delete
            Tooltip { Title: Delete, Text: "Removes the file for good", Actions { Item { Label: Undo, On_Click: undo } } }
          }
          Button {
            Label: Save
            Variant: tonal
            Tooltip: "Save the file"
          }
        }
      }
    python: |
      from tess_ui.widgets import tooltip

      tip = tooltip(app.window, "Save the file", anchor=save.node)
    see: [guide/overlays.md]

  # -- Containment -------------------------------------------------------------------------------
  - slug: cards
    title: Cards
    group: Containment
    views: [Card]
    md3: |
      A card holds content and actions about one subject. It comes **elevated** (a shadow), **filled** (a
      higher surface) or **outlined** (a border). All have a medium (12dp) corner radius.
    built: |
      `Card` is a view Tesserae ships (`Card_View.tdl`): a surface with 12 pixel corners that is as tall as what is in it.

      The `Variant` is a shadow (`elevated`, level 1), a higher surface (`filled`) or a 1 pixel `outline_variant` border (`outlined`). The `Headline` is `title_large`, the `Subhead`
      `title_small` and the `Text` `body_medium`, with 16 pixels around them. A `Media` picture runs across the top, clipped to the corners (160 pixels tall unless `Media_Height` says
      otherwise). An `Actionable` card is one pressable surface: a state layer, a ripple, Enter, and a lift to level 2 for the elevated one when hovered. A `Selected` card is
      `secondary_container` (an outlined one gets an `outline` border instead); the caller decides when, as in `On_Click: "picked = not picked"`. A `Disabled` card is dimmed.

      Your own content goes in the default slot, after the text, and buttons in the `Actions` slot (a row at the end). `Handlers { On_Click: ... }` on the call is
      what a press of an actionable card does. A plain card is a group and takes no focus. Not built: dragging and swiping a card, and the dragged state.
    usage_view: |
      Container {
        Name: trips
        Style { Flex_Direction: horizontal, Gap: 16, Padding: 16, Width: 560, Height: 360 }
        Children {
          Card {
            Headline: Paris
            Subhead: "Three days"
            Text: "Flights and a hotel."
            Media: paris.png
            Style { Width: 240 }
            Children {
              Button {
                Label: Book
                Variant: text
                Slot: actions
              }
            }
          }
          Card {
            Variant: outlined
            Headline: Rome
            Actionable: true
            Selected: <| picked |>
            Style { Width: 240 }
            Handlers {
              On_Click: pick
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import card

      summary = card(app.window, 240, 120, variant="elevated")

  - slug: dialogs
    title: Dialogs
    group: Containment
    views: [Dialog]
    md3: |
      A dialog interrupts to ask for a decision or give needed information. It has a headline, supporting text and
      up to two actions, on a raised surface over a scrim, and blocks what is behind it.
    built: |
      `Dialog` is a view Tesserae ships (`Dialog_View.tdl`): a modal [`Overlay`](../guide/view-language.md#overlays) holding a raised panel (28 pixel
      corners, 24 of padding) with an optional icon, a headline, supporting text, your own content and text-button actions.

      `Open` is two-way: Escape and a press on the scrim write `false` back, unless `Dismissible` is off, when only an action closes it. Each of the `Actions` is `{Label, Value}`
      and optionally `{Variant}` (a text button unless it says otherwise); pressing one closes the dialog and writes its `Value` to `Result`, which stays empty when the dialog was
      dismissed. The panel is `Width` wide, held between 280 and 560 pixels (312 by default), and the content scrolls beyond `Max_Height` (480). `Fullscreen` is the full-screen
      form: the panel fills the window on `surface`, with a close button, the headline and the actions in a 56 pixel bar along the top, and the content scrolling under it.

      Children are the content, after the supporting text. When the content scrolls, a line shows above the actions. Actions stack when they do not fit
      one row. A screen reader hears a `dialog` named by the headline (tess_re has no `alertdialog` role). In the full-screen form the close button writes
      `false` to `Open` with no result, the actions sit in the bar instead of under the content (MD3 has one confirming action there), and a line shows under
      the bar once the content has scrolled; use it where the window is `Compact` (`Fullscreen: "<| app.width_class == 'compact' |>"`). Not built: focusing a
      form dialog's first field.
    usage_view: |
      Container {
        Name: files
        Style { Flex_Direction: vertical, Width: 480, Height: 360 }
        Children {
          Dialog {
            Open: <| confirming |>
            Result: <| choice |>
            Headline: "Discard draft?"
            Text: "This cannot be undone."
            Icon: home
            Actions {
              Item { Label: Cancel, Value: cancel }
              Item { Label: Discard, Value: discard }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import dialog

      confirm = dialog(app.window, "Discard changes?", "Your edits will be lost.", 320, 200,
                       actions=[("Cancel", None), ("Discard", viewmodel.discard)])
      confirm.open()
    see: [guide/overlays.md]

  - slug: file-dialogs
    title: File dialog
    group: Containment
    views: [FileDialog]
    widgets: [FileBrowser]
    md3: |
      Material Design 3 has no file dialog: a desktop app needs one, and it is built from the parts MD3 does describe, a modal dialog over a scrim, a list, text fields, buttons and a menu.
    built: |
      `FileDialog` is a view Tesserae ships (`FileDialog_View.tdl`): a modal [`Overlay`](../guide/view-language.md#overlays) holding a panel (28 pixel corners, 24 of padding, as a
      [dialog](dialogs.md) has) for choosing files and folders inside the app, with no window of the operating system. `Mode` is `open` (existing files: one, or several with `multiple`),
      `save` (a folder and a name) or `folder` (a folder). `Open` is two-way: Escape and a press on the scrim write `false` back and call `On_Cancel`; so does Cancel. OK is off until
      there is something to give. Pressing it writes `Value`, the absolute path as text (a list of paths when `multiple`), closes the dialog and calls `On_Accept`. Nothing is read from the disk until
      `Open` goes true, and each opening starts again at `Start` with the folder as it is then.

      What it shows. A path bar (a text field: type a path, or `~`, and press Enter; one that is not a folder says so under the list) with Back, Forward, Up, Home and Refresh, and under it the
      folders of the path as buttons. A list of the folder with a column of names, one of sizes and one of times: folders first, then files, each sorted without regard to case. A switch for the
      names that start with a dot (off unless `Show_Hidden`). `Filters` is the file types, each `{label, patterns: ["*.tdl"]}`; an `All files` choice always follows them, the first is the one in
      use (`Filter` says another), and a type hides the files that do not match (case does not count) and never a folder. With only `All files` there is no type button. In a `folder` dialog only folders
      are listed. `New folder` is offered when saving and when choosing a folder: it asks for a name and makes the folder, and it is picked.

      Picking. A press picks a row; Ctrl and Shift (with `multiple`) flip and extend the picks. A folder is entered by pressing it twice (or Enter on it), a file chosen the same way. In an open dialog a
      folder is never an answer; in a folder dialog nothing picked means the folder shown. When saving, the file name field starts with `Filename`, picking a file puts its name there, and a name with no
      extension gets the one of the file type in use (`*.tdl` gives `.tdl`; `All files` adds none). A name with a `/` or `\`, or the name of a folder, is a problem the dialog says; a name that is a file already asks
      "Replace file?" before it answers. The dialog never writes the file: it only says which.

      `Root` keeps it inside a folder: the path bar, Up, Back, Home and the trail cannot leave it, nor can a link inside it that leads out. `Start` is the folder it opens in (`Root`, then the working folder, when left
      out); a start that cannot be read opens the nearest folder above it and says why. A folder that cannot be read (permission denied), has gone, or is a file is a message in red under the list, and the dialog
      stays where it was, usable; it never raises.

      The keyboard. The list has the focus when the dialog opens. Up, Down, Page Up, Page Down, Home and End move the cursor row and pick it (Shift extends, with `multiple`); Enter opens the row; Backspace goes up;
      Alt+Left and Alt+Right are Back and Forward; Ctrl+A picks every file (with `multiple`); letters jump to the next name that starts with them. The list scrolls to keep the cursor in view. A screen reader
      hears a `dialog` named by `Headline` (`Open file`, `Save file` or `Choose folder` when left out), a `list` of `listitem`s each named by its file and `Selected` when picked, labelled buttons, and an `alert` for a message.

      The list is a `VirtualList`: it builds only the rows in view (`Rows` of them, 8 by default, and three past each edge), and a folder is read once, when entered, with one listing and one `stat` for each entry,
      so a folder of ten thousand files opens at once. The disk is reached only through `tess_ui.filesystem` (`FileSystem`: `list_dir`, `is_dir`, `exists`, `make_dir`, `real_path`, `home`, `cwd`), which `filesystem.use()`
      swaps for a test or for something that is not a disk. What the dialog keeps (the folder, the history, the picks, the rules above) is `tess_ui.file_browser.FileBrowser`, which has no window and can be used
      alone; the view reaches it through `FileBrowser`, a control that draws nothing (`tess_ui.file_controls`).

      The look is in `FileDialog_Stylesheet.tdl`: write one in your project to change the panel, the rows and the message. Not built: bookmarks and a places sidebar, a preview, drag and drop, renaming and deleting,
      sorting by a column, a column for the file type, hidden attributes other than a leading dot (Windows' hidden flag), a folder tree, drives on their own (a Windows drive letter is the first step of the trail).
    usage_view: |
      Container {
        Name: documents
        Style { Flex_Direction: vertical, Width: 900, Height: 700 }
        Children {
          Button {
            Name: choose
            Label: "Open a plan"
            Handlers {
              On_Click { Set { Target: choosing, Value: <| True |> } }
            }
          }
          FileDialog {
            Open: <| choosing |>
            Mode: open
            Start: "~/Documents"
            Filters {
              Item { Label: "TDL files", Patterns: ["*.tdl"] }
              Item { Label: Text, Patterns: ["*.txt", "*.md"] }
            }
            Value: <| plan |>
            On_Accept: load_plan
          }
        }
      }
    python: |
      from tess_ui import Signal, ViewModel
      from tess_ui.file_dialog import FileDialogRequest


      class DocumentsViewModel(ViewModel):
          views = "documents"

          def __init__(self):
              super().__init__()
              self.files = FileDialogRequest(self)      # file_open, file_mode, file_start, ... and file_accepted, file_cancelled

          def save_as(self):
              self.files.show(mode="save", filters=[{"label": "TDL files", "patterns": ["*.tdl"]}], filename="plan",
                              on_accept=lambda paths: print("save to", paths[0]))
    see: [guide/overlays.md, components/dialogs.md]

  - slug: dividers
    title: Dividers
    group: Containment
    views: [Divider]
    md3: |
      A divider is a thin line that groups and separates content in lists and containers. It spans the whole length (**full-width**), starts
      16 dp in from the start (**inset**), or is 16 dp in from both ends (**middle inset**), and is horizontal or vertical.
    built: |
      `Divider` is a view Tesserae ships (`Divider_View.tdl`) with its look as rules (`Divider_Stylesheet.tdl`): a line in the
      `outline_variant` colour that fills the length it is in, and is a `separator` to a screen reader.

      The `Variant` says how much of the ends it keeps clear (`full` by default; `inset` leaves 16 pixels at the start, `middle` 16 at both ends). A `horizontal` divider fills the
      width it is in and a `vertical` one the height (in a container that does not set `Align_Content`, which would size it to its content, and so to nothing); it is 1 pixel thick unless `Thickness` says.
    usage_view: |
      Container {
        Name: settings
        Style { Flex_Direction: vertical, Width: 320, Height: 160 }
        Children {
          Text {
            Text: Wi-Fi
            Typography_Role: body_large
            Style { Foreground: on_surface }
          }
          Divider {
            Variant: inset
          }
          Text {
            Text: Bluetooth
            Typography_Role: body_large
            Style { Foreground: on_surface }
          }
          Divider { }
        }
      }
    after: |
      ## Changing its look

      Write rules for `Divider` in your app's stylesheet; they sit above the shipped ones, and a `Style:` on the node beats every rule for the
      fields it sets.

      ```tdl
      Styles {
        Rule {
          Widget: Divider
          Style { Background: outline }
        }
      }
      ```

      A view named `Divider_View.tdl` in your project replaces the shipped divider, and its shipped look with it.
    python: |
      from tess_ui.widgets import divider

      rule = divider(app.window, 240)

  - slug: lists
    title: Lists
    group: Containment
    views: [ListItem]
    md3: |
      A list is a column of rows, each a headline with optional leading and trailing content and supporting text.
    built: |
      `ListItem` is a view Tesserae ships (`ListItem_View.tdl`): a row as wide as its place, 56, 72 or 88 pixels tall by its lines. A list is a
      container of them (or a `For:`, or a `VirtualList`, over your data).

      The `Headline` is the first line, `Supporting` the line under it and `Overline` a small line above it; they set the height (56 for one line, 72 for two, 88 for three) unless
      `Lines` says. Before the text goes a 24 pixel `Leading_Icon`, a 40 pixel circle holding the letters of `Leading_Text`, or a 56 pixel `Leading_Image`; after it a `Trailing_Text` or a
      `Trailing_Icon`. With `Selectable` a press flips `Selected`, and a selected row is `secondary_container`. `Divider` draws a line along the bottom edge.

      Your own content goes in the `Leading` and `Trailing` slots (`Slot: trailing` on a child): a switch, a checkbox, a button. `Handlers { On_Click: ... }` on
      the call is what a press does. A section's header can hold the top of a `ScrollView` while its rows scroll past: give it `Style { Sticky: 0 }`. Not built: swipe actions, drag to
      reorder, and the dragged state.
    usage_view: |
      Container {
        Name: mail
        Style { Flex_Direction: vertical, Width: 360, Height: 300 }
        Children {
          ListItem {
            Headline: Inbox
            Supporting: "12 unread"
            Leading_Icon: home
            Trailing_Text: "5m"
            Divider: true
            Handlers {
              On_Click: open_inbox
            }
          }
          ListItem {
            Headline: Wi-Fi
            Supporting: Connected
            Children {
              Switch {
                Slot: trailing
                Selected: <| wifi |>
              }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import list_, list_item

      rows = list_(app.window, [list_item(app.window, name) for name in ("Inbox", "Sent", "Drafts")], width=320)
    see: [guide/lists.md, guide/effects.md]

  - slug: side-sheets
    title: Side sheets
    group: Containment
    views: [SideSheet, SideSheetModal, SideSheetPanel]
    md3: |
      A side sheet holds secondary content beside the main content. A **standard** one shares the window with it;
      a **modal** one covers it over a scrim and must be dismissed.
    built: |
      Three views Tesserae ships: `SideSheet` (standard, inline), `SideSheetModal` (over a scrim) and `SideSheetPanel` (the inside they share).

      `Open` is two-way: the close button writes `false`, and so do Escape and a press on the scrim of a modal sheet. The header has a `title_large` `Title`, a back button (`Back: true`)
      that runs `On_Back`, and a close button (`Closable`, on by default). The sheet is `Width` wide, held between 256 and 400 pixels (360 by default). A modal sheet also takes `Side`
      (`end`, the default, or `start`: the edge it comes from) and `Dismissible` (off, Escape and the scrim do not close it).

      Children are the content, which scrolls (a line shows over the actions once it has); children with `Slot: actions` are the buttons, in a row at the bottom right.
      A standard sheet is inline: it takes room from the content while `Open` and its width eases open and shut; put it first in its row for the start side and last for
      the end. A modal sheet is `surface_container_low` at level 1 with 16 pixel corners on the open side, over the content. Not built: the detached sheet, and the modal
      sheet sliding in from the edge.
    usage_view: |
      Container {
        Name: editor
        Style { Flex_Direction: horizontal, Width: 720, Height: 420 }
        Children {
          Container {
            Name: page
            Style { Flex: fill, Height: 100% }
          }
          SideSheet {
            Open: <| filtering |>
            Title: Filters
            Children {
              Switch {
                Label: "Only mine"
              }
              Button {
                Slot: actions
                Label: Apply
                Handlers {
                  On_Click: apply
                }
              }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import side_sheet

      sheet = side_sheet(app.window, 280, modal=True)
      sheet.open()
    see: [guide/overlays.md]

  - slug: accordions
    title: Accordions
    group: Containment
    views: [Accordion, AccordionGroup]
    md3: |
      Material Design 3 has no accordion of its own. Tesserae's is built in MD3's terms: a list row with a chevron
      that turns when the section opens.
    built: |
      Two views Tesserae ships. `Accordion` is one section: a 56 pixel header button (the `Title` and a chevron that turns over in 200 milliseconds) and, while `Expanded`
      (two-way), its content (the children). `AccordionGroup` makes several behave as one set with dividers between them.

      A press, Enter or Space on the header toggles `Expanded`, and `On_Toggle` is called after it. A `Disabled` section is dimmed and does not toggle. An `AccordionGroup` takes
      `Items`, each `{Value, Title, Text}` (the text is the section's content; for more than text, write the `Accordion` sections yourself); `Mode` is `single` (the default: opening one
      closes the rest) or `multiple`, and `Open` is the value that is open (empty for none), or with `multiple` the list of values that are.

      A screen reader hears a button that says whether it is expanded and what it controls; the content is hidden from it while closed and its parts are not built, so they
      take no Tab stop. The up and down arrows move between the headers, and Home and End go to the first and last. Not built: the content's height easing open
      (the engine cannot ease a height to `auto`).
    usage_view: |
      Container {
        Name: faq
        Style { Flex_Direction: vertical, Gap: 16, Width: 420, Height: 360 }
        Children {
          Accordion {
            Title: Details
            Expanded: <| showing |>
            Children {
              Text {
                Text: "More about it"
                Typography_Role: body_medium
                Style { Foreground: on_surface_variant }
              }
            }
          }
          AccordionGroup {
            Open: <| which |>
            Items {
              Item { Value: a, Title: Shipping, Text: "Two days." }
              Item { Value: b, Title: Returns, Text: "Thirty days." }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import accordion_header

      details = accordion_header(app.window, "Details", expanded=False, width=320)

  - slug: trees
    title: Trees
    group: Containment
    views: [Tree, TreeNode]
    md3: |
      Material Design 3 has no tree view; this is MD3's list row, indented by depth, with a chevron on the rows
      that open.
    built: |
      Views Tesserae ships: `Tree` (the whole tree from data), and `TreeNode` (one row, a branch with a chevron or a leaf). The rows are one flat list (`tree_rows(nodes, expanded)`):
      the children of an open branch follow it.

      The `Nodes` are rows, `{Value, Label}` and optionally `{Icon, children, Disabled}`, where `children` is a list of the same shape. `Expanded` (the values of the open branches)
      and `Selected` (the value of the chosen row) are two-way. Rows are 56 pixels tall, or 40 with `Compact`.

      A row is indented 16 pixels plus 24 for each level, has a 24 pixel chevron that turns a quarter when its branch opens (a leaf keeps the room), an optional icon and a `body_large`
      label; the chosen row is `secondary_container`. A press chooses a row and opens or closes a branch. One Tab stop; the up and down arrows move through the rows that show, Right
      opens a branch and Left closes it, and typing the start of a label jumps to a row. A screen reader hears a tree whose items are flat rows with their level, their place among their siblings (`pos_in_set` of `set_size`)
      and, for a branch, whether it is expanded: there is no group around the children of an open branch. `TreeNode` can be used alone for a custom tree. `Multiple: true` chooses several rows (the engine's rules: click chooses one, Ctrl+click toggles, Shift+click and Shift+Arrow choose a range, Space toggles, Ctrl+A chooses the rows that show); `Selection` holds the chosen values, two-way, and a chosen row inside a closed branch stays chosen; `On_Change` is called after each change to them, with `event.reason` (`pointer`, `keyboard`, `api`), `event.detail` (`select`, `toggle`, `range`, `all`, `clear`), `event.count`, `event.selection` and `event.anchor`. Not built: loading children when a branch first opens, dragging to reorder, a context menu, and
      building only the rows in view for a very large tree.
    usage_view: |
      Container {
        Name: files
        Style { Width: 360, Height: 420 }
        Children {
          Tree {
            Expanded: <| open |>
            Selected: <| current |>
            Nodes {
              Item {
                Value: docs
                Label: Documents
                Icon: folder
                Children {
                  Item { Value: a, Label: Letter }
                  Item { Value: b, Label: Reports, Children { Item { Value: q, Label: Q1 } } }
                }
              }
              Item { Value: readme, Label: Readme, Icon: file }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import tree_node

      folder = tree_node(app.window, "src", depth=0, expanded=True)
      file = tree_node(app.window, "app.py", depth=1, leaf=True)

  # -- Navigation --------------------------------------------------------------------------------
  - slug: navigation-rail
    title: Navigation rail
    group: Navigation
    views: [NavigationRail, NavigationRailItem, NavigationRailScreens, NavigationRailScreen]
    md3: |
      A navigation rail puts three to seven destinations in a narrow column beside the content, on medium and
      large windows. Each is an icon in a pill with a label; the selected one's pill is filled.
    built: |
      Four views Tesserae ships: `NavigationRail` (the column), `NavigationRailItem` (one destination), `NavigationRailScreens` (a rail whose destinations are the
      app's screens) and `NavigationRailScreen` (one such destination).

      The `Items` of a `NavigationRail` are `{Value, Label, Icon}` and optionally `{Badge, Disabled}` (`Badge: true` is a dot), and `Selected` is the value of the chosen one: a press, or an
      arrow key, writes it back. Those of a `NavigationRailScreens` are `{Screen, Label, Icon}` and optionally `{Badge}`. The rail is 80 pixels wide with the labels under the icons, or 220
      with `Expanded: true` and the labels beside them; `Alignment` puts the destinations at the `top` (the default), `center` or `bottom` of the column, and `Frosted: true` makes the
      surface translucent and blurred.

      A destination is a 24 pixel icon in a 56 by 32 pill (`secondary_container` when it is the chosen one) over a `label_medium` label, 12 pixels from the
      next, starting 44 pixels down. Children with `Slot: header` (a menu button, a FAB) go above the destinations and `Slot: footer` below. There is one Tab stop;
      the up and down arrows move the focus and choose the destination. A screen reader hears a link named by the label, the current one marked as the page.
      The screens rail follows `app.current_screen` and a press is `navigate_to(screen)`; it belongs in each screen (or in a window's shell). Not built: the
      modal expanded rail, sections with headings, the pill growing as it is selected (it fades in), and a `navigation` role for the rail (tess_re has none, so it is a `Group` named Navigation).
    usage_view: |
      Container {
        Name: shell
        Style { Flex_Direction: horizontal, Width: 480, Height: 400 }
        Children {
          NavigationRail {
            Selected: <| page |>
            Items {
              Item { Value: home, Label: Home, Icon: home }
              Item { Value: search, Label: Search, Icon: search, Badge: 3 }
            }
          }
          NavigationRailScreens {
            Items {
              Item { Screen: Main, Label: Tasks, Icon: home }
              Item { Screen: Settings, Label: Settings, Icon: settings }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import navigation_rail

      rail = navigation_rail(app.window, ["Home", "Search"], ["home", "search"], selected=0)
    see: [guide/windows-and-docks.md, guide/effects.md]

  - slug: navigation-drawer
    title: Navigation drawer
    group: Navigation
    views: [NavigationDrawer, NavigationDrawerItem, NavigationDrawerModal, NavigationDrawerPanel, NavigationDrawerScreens]
    md3: |
      A navigation drawer holds more destinations than a rail, as a vertical list of icon-and-label items. It can
      be permanent (standard) or slide over the content (modal).
    built: |
      Views Tesserae ships: `NavigationDrawer` (standard, beside the content), `NavigationDrawerModal` (over a scrim), `NavigationDrawerScreens` (the app's screens), and
      `NavigationDrawerItem` (one destination) and `NavigationDrawerPanel` (the inside the first two share).

      The `Items` are rows: `{Value, Label, Icon}` and optionally `{Badge, Disabled}`, `{heading: Text}` for a section's title, and `{divider: true}` for a line (for
      `NavigationDrawerScreens`, `{Screen, Label, Icon}` in place of `Value`). `Selected` is the chosen destination, and a press or an arrow key writes it back. `Open` is two-way: on a
      standard drawer it says whether the drawer takes its room (the width eases, which is how it collapses), on a modal one whether it is showing. The drawer is `Width` wide, held between
      256 and 360 pixels (360 by default). `Frosted: true` makes the surface translucent and blurred.

      A destination is a 56 pixel pill with 28 pixel corners, a 24 pixel icon, a `label_large` label and a badge at the end; the chosen one is `secondary_container`.
      Children with `Slot: header` and `Slot: footer` go above and below the destinations, which scroll when there are too many. A modal drawer is
      `surface_container_low` at level 1 with 16 pixel corners on the right; a press on a destination closes it, as do Escape and a press on the scrim. A screen reader hears
      a link per destination, the current one marked as the page. Not built: the modal drawer sliding in (an overlay is where its style says when first drawn), and a
      standard drawer that becomes a rail by itself when the window narrows.
    usage_view: |
      Container {
        Name: shell
        Style { Flex_Direction: horizontal, Width: 720, Height: 480 }
        Children {
          NavigationDrawer {
            Selected: <| page |>
            Items {
              Item { Value: inbox, Label: Inbox, Icon: home, Badge: 24 }
              Item { Value: sent, Label: Sent, Icon: send }
              Item { Divider: true }
              Item { Heading: Labels }
              Item { Value: work, Label: Work, Icon: tag }
            }
          }
          NavigationDrawerScreens {
            Items {
              Item { Screen: Main, Label: Tasks, Icon: home }
              Item { Screen: Settings, Label: Settings, Icon: cog }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import navigation_drawer

      drawer = navigation_drawer(app.window, ["Inbox", "Search"], ["home", "search"], selected=0)
    see: [guide/overlays.md, guide/effects.md]

  - slug: top-app-bar
    title: Top app bar
    group: Navigation
    views: [TopAppBar]
    md3: |
      A top app bar sits along the top of a screen with its title and the actions for it: a navigation icon at the
      start and up to a few action icons at the end.
    built: |
      `TopAppBar` is a view Tesserae ships (`TopAppBar_View.tdl`): a bar as wide as its place, built from `IconButton`s and a title.

      The `Variant` is `small` (64 tall, the title beside the icon, the default), `center` (64, the title in the middle), `medium` (112) or `large` (152), the last two with the title under
      the icons. `Leading_Icon` is the navigation icon (`menu` or `arrow_back`), `Leading_Label` its name and tooltip, and `On_Leading` what it does. `Actions` are up to three icons at the
      end, each `{Value, Icon, Label}`; pressing one sets `Chosen` to its `Value`. `Collapsed` makes a medium or large bar show as a small one (the height eases), and `Scrolled` says content
      is under the bar: its colour goes from `surface` to `surface_container`. `Frosted: true` makes the surface translucent and blurred.

      Bind `Collapsed` and `Scrolled` to how a list under the bar has scrolled (the `At_Top` of a `ScrollView`). Every icon is a button with a label, which is its name and its
      tooltip. With `App(borderless=True)` a bar can sit in a window's title area; the title bar of a window is `TitleBar`. Not built: the contextual action mode (a selection bar
      that replaces it), and a search bar inside it (`SearchBar` is its own view).
    usage_view: |
      Container {
        Name: inbox
        Style { Flex_Direction: vertical, Width: 480, Height: 400 }
        Children {
          TopAppBar {
            Title: Inbox
            Variant: large
            Leading_Icon: menu
            On_Leading: open_drawer
            Collapsed: <| not at_top |>
            Scrolled: <| not at_top |>
            Chosen: <| command |>
            Actions {
              Item { Value: search, Icon: magnify, Label: Search }
              Item { Value: more, Icon: dots_vertical, Label: More }
            }
          }
          ScrollView {
            At_Top: <| at_top |>
            Style { Flex: fill }
          }
        }
      }
    python: |
      from tess_ui.widgets import top_app_bar

      bar = top_app_bar(app.window, "Notes", leading_icon="menu", trailing_icons=["settings"])
    see: [guide/custom-title-bars.md, guide/windows-and-docks.md, guide/effects.md]

  - slug: tabs
    title: Tabs
    group: Navigation
    views: [Tabs]
    md3: |
      Tabs organise content at one level of hierarchy, with the selected tab marked by an indicator. Primary tabs
      may carry an icon above the label.
    built: |
      `Tabs` is a view Tesserae ships (`Tabs_View.tdl`): a row of equal tabs over a divider, with an indicator under the chosen tab that
      slides to the next one.

      The `Tabs` are `{Value, Label}` and optionally `{Icon, Badge}`; an expression follows its Signals. `Selected` is the value of the chosen tab, and a press or an arrow key writes it
      back. With `Variant: primary` (the default) the indicator is 3 pixels tall, rounded on top, and 12 pixels in from each side of the tab; with `secondary` it is 2 pixels tall across
      the whole tab. Every tab is `Tab_Width` wide (120 by default).

      The bar is 48 pixels tall, or 64 when a primary bar has an icon. The chosen tab's label and icon are `primary`, the others `on_surface_variant`. The bar
      is a `tablist` with one Tab stop; the arrow keys, Home and End move the focus and choose the tab. The panel each tab shows is yours: put an
      `If: "selected == 'trips'"` on it. Not built: a bar that scrolls when the tabs do not fit.
    usage_view: |
      Container {
        Name: trips
        Style { Flex_Direction: vertical, Width: 360, Height: 160 }
        Children {
          Tabs {
            Selected: <| tab |>
            Tabs {
              Item { Value: flights, Label: Flights, Icon: home }
              Item { Value: trips, Label: Trips, Icon: search, Badge: 3 }
              Item { Value: explore, Label: Explore, Icon: menu }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import tabs

      bar = tabs(app.window, ["Videos", "Photos"], selected=0)

  - slug: menus
    title: Menus
    group: Navigation
    views: [Menu, MenuItem]
    md3: |
      A menu shows a list of choices on a temporary surface, opened by a button, a right click or a keyboard
      shortcut.
    built: |
      Two views Tesserae ships: `Menu`, an anchored `Overlay` holding the rows, and `MenuItem`, one 48 pixel row.

      A `Menu` is shown while `Open` is true; Escape and a press outside write `false` back. `Anchor` is the name of the node in the calling view it sits against, and `Placement`
      (`below` by default, `above`, `start` or `end`) the side, which it flips or shifts to fit. The `Items` are rows `{Value, Label}` and optionally `{icon, shortcut, checked, disabled,
      submenu}`, `{divider: true}` for a line and `{heading: Text}` for a small heading. Pressing an item writes its `value` to `chosen`, closes the menu and calls `on_pick`. With `mode:
      check` pressing an item flips its check (the checked values are `checks`); with `mode: radio` one item is checked (`selected`). The menu is `width` wide, 112 to 280 pixels (200 by
      default), and `Frosted: true` makes the surface translucent and blurred.

      A `MenuItem` has a `Label`, an `Icon`, `Trailing_Text` (a shortcut), `Checked` (true shows a check, false keeps the room, empty is not checkable), `Submenu` (a chevron) and
      `Disabled`. An item with a `Submenu` list opens another `Menu` beside it, on a press or the Right arrow, and choosing in it closes both. The arrows move between rows,
      Enter chooses, typing the start of a label jumps to it. A long press can open it (`Handlers { On_Long_Press: ... }` on the node, writing `Open`), and in Python `attach_context(node)`
      on a `menu(...)` opens it at the pointer on a right-click. Not built: a right-click opener in a view, and the exposed dropdown under a text field.
    usage_view: |
      Container {
        Name: editor
        Style { Width: 480, Height: 360 }
        Children {
          Button {
            Name: more
            Label: More
            Handlers {
              On_Click { Set { Target: open, Value: <| True |> } }
            }
          }
          Menu {
            Open: <| open |>
            Anchor: more
            Chosen: <| command |>
            Items {
              Item { Value: cut, Label: Cut, Shortcut: "Ctrl+X" }
              Item { Value: copy, Label: Copy, Icon: content_copy }
              Item { Divider: true }
              Item { Value: share, Label: Share, Submenu { Item { Value: mail, Label: Mail }, Item { Value: link, Label: Link } } }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import menu

      actions = menu(app.window, [("Cut", viewmodel.cut), ("Copy", viewmodel.copy)], width=200)
      actions.open(save.node)
    see: [guide/overlays.md, guide/effects.md]

  - slug: search
    title: Search
    group: Navigation
    views: [SearchBar, SearchView]
    md3: |
      A search bar is a rounded field that starts a search; the search view is the full-size surface that shows
      suggestions and results once it is focused.
    built: |
      Two views Tesserae ships. `SearchBar` is a 56 pixel `surface_container_high` pill at level 3 with a leading icon, the text, and trailing parts. `SearchView`
      is the docked panel that opens under it with the suggestions, history and results.

      `Query` is what has been typed. `Active` says the search is under way: pressing the bar or typing in it sets it, and the back arrow clears it. The bar has a `Placeholder`, a
      `Leading_Icon` (a search glass; `menu` makes it a menu button that runs `On_Leading`), an optional `Trailing_Icon` (a microphone, say, that runs `On_Trailing` and shows
      while the field is empty) and an optional avatar (`Avatar_Text`); Enter calls `On_Search`. The `Results` of a `SearchView` are `{Value, Label}` rows, optionally with `Supporting` and
      `Icon`; the row pressed goes to `Chosen`, `Open` says whether the view shows, and `Anchor` names the bar it sits under. `Frosted: true` makes the bar and the view translucent
      and blurred.

      A clear button shows once there is text. While active the leading icon is a back arrow. Bind the bar's `Active` and the view's `Open` to the same name, and the view's `Results` to
      something that follows `Query`. The view says how many results there are, politely, and `Empty` text when a query finds none. Escape and a press outside close it. Not built:
      the full-screen search view for small windows, and a keyboard shortcut that focuses the bar.
    usage_view: |
      Container {
        Name: notes
        Style { Flex_Direction: vertical, Width: 420, Height: 420, Padding: 16 }
        Children {
          SearchBar {
            Name: bar
            Query: <| q |>
            Active: <| searching |>
            Placeholder: "Search notes"
            Style { Width: 360 }
          }
          SearchView {
            Anchor: bar
            Open: <| searching |>
            Query: <| q |>
            Results: <| matches |>
            Chosen: <| picked |>
          }
        }
      }
    python: |
      from tess_ui.widgets import search_bar

      search = search_bar(app.window, "Search notes", 360)
    see: [guide/effects.md]

  - slug: toolbars
    title: Toolbars
    group: Navigation
    views: [Toolbar]
    md3: |
      A toolbar groups the actions for the content around it. A **docked** one is fixed to an edge; a **floating**
      one is a rounded bar over the content.
    built: |
      `Toolbar` is a view Tesserae ships (`Toolbar_View.tdl`): one widget for the docked and the floating toolbar, built from `IconButton`s, an optional `Fab` and a `Menu`.

      A `docked` toolbar spans its width (or `Width`), 64 tall, on `surface_container`; a `floating` one is a pill with a shadow as long as its buttons, and with `Orientation: vertical` a
      column 64 wide. `Vibrant: true` puts it on `primary_container`, with `on_primary_container` icons. The `Items` are icon buttons, each `{Value, Icon, Label}` and optionally `Disabled`;
      the `Value` of the item or overflow row pressed goes to `Chosen`. `Overflow` is `Menu` rows under a more button at the end. `Fab_Icon` (with `Fab_Label` and `On_Fab`) adds a small
      action button at the end. With `Fit`, items that do not fit move, in order, into the overflow menu; a docked toolbar measures itself, a floating one uses `Max_Length` pixels.
      `Hidden` fades it out and takes its buttons out of the tab order (bind it to the way a list scrolls). `Label` is its accessible name, and `Disabled` stops every button.

      Your own content goes in the default slot after the items. The arrow keys move between the buttons (one Tab stop). The role is `Group`: the engine has no toolbar role.
      With `Fit`, the items that spill and the rows of `Overflow` share one menu, a divider between. Not built: sliding out of the way (it fades).
    usage_view: |
      Container {
        Name: editor
        Style { Width: 420, Height: 200, Padding: 16, Flex_Direction: vertical, Gap: 16 }
        Children {
          Toolbar {
            Name: tools
            Items {
              Item { Value: bold, Icon: format_bold, Label: Bold }
              Item { Value: italic, Icon: format_italic, Label: Italic }
              Item { Value: link, Icon: link, Label: Link }
            }
            Overflow {
              Item { Value: copy, Label: Copy }
              Item { Value: share, Label: Share }
            }
            Fab_Icon: plus
            Fab_Label: Add
            Chosen: <| last |>
          }
          Toolbar {
            Variant: floating
            Vibrant: true
            Items {
              Item { Value: search, Icon: search, Label: Search }
              Item { Value: star, Icon: star, Label: Star }
            }
          }
          Text {
            Text: <| last |>
            Typography_Role: body_medium
            Style { Foreground: on_surface }
          }
        }
      }
    python: |
      from tess_ui.widgets import toolbar

      tools = toolbar(app.window, variant="floating", width=240)

  - slug: links
    title: Links
    group: Navigation
    widgets: [Link]
    md3: |
      A link takes the user somewhere else, or opens a related page. It is text, in the primary colour.
    built: |
      `Link` is text that takes focus, and that Enter or a click activates. It is `primary`, in `body_medium` unless you name another type role.

      The `text` also names the link for a screen reader. Its `Href` is opened in the OS's browser or mail program when the link is activated: `http`, `https`, `mailto` and `tel` only,
      anything else is refused. Opening it sets a bound `Visited`, and `State: visited` in a rule colours it (`secondary` by default). A disabled link is dimmed, out of the Tab order,
      and does nothing. It is underlined while the pointer is over it or keyboard focus is on it (`Underline: hover`, the default), always, or never. `Handlers { On_Click: ... }` runs
      as well as the `Href` opens; a link with no `Href` just runs its handler.

      The type properties of `Text` (`Typography_Role`, `Wrap`, `Overflow`, `Max_Lines`, ...) apply. A link inside a longer text is a `link` run of a `Text` (`Runs`, [Rich Text & Links](../guide/rich-text.md)); a `Link` is for a whole line.
    usage_view: |
      Container {
        Name: help
        Style { Flex_Direction: vertical, Gap: 8, Width: 300, Height: 100 }
        Children {
          Link {
            Text: "Read the docs"
            Href: "https://example.com/docs"
            Visited: <| docs_seen |>
          }
          Link {
            Text: "Not now"
            Disabled: true
          }
          Link {
            Text: "Sign in"
            Handlers {
              On_Click: sign_in
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import link

      help_link = link(app.window, "Read the docs", 160, on_click=viewmodel.open_docs)
    see: [guide/rich-text.md]

  # -- Selection and input -----------------------------------------------------------------------
  - slug: checkboxes
    title: Checkbox
    group: Selection and input
    widgets: [Checkbox]
    md3: |
      A checkbox lets the user select one or more items from a set, or turn an option on or off. It has a 40dp
      state layer around an 18dp box.
    built: |
      `Checkbox` is one of Tesserae's controls (`tess_ui.controls.Checkbox`). Give `Checked` a bare reference and a press writes it back. It has three
      states: on, off, and empty (`null`), which is neither: a dash in a filled box, for a parent of some checked children. A press turns an empty one on.

      The `Label` sits beside the box and is part of what you press: pressing the text toggles the box and gives it the focus. `Error` draws it in the error colours, and a
      disabled one is dimmed and does nothing. `Handlers { On_Change: ... }` runs after the user changes it (not when the bound value changes).

      The colour is `Style.Foreground`. The 18 pixel box sits in a 48 pixel target with a 40 pixel state layer; Tab reaches it, and Space or Enter toggles it.
    usage_view: |
      Container {
        Name: terms
        Style { Flex_Direction: vertical, Gap: 4, Width: 280, Height: 160, Padding: 16 }
        Children {
          Checkbox {
            Checked: <| all_read |>
            Label: "I have read the terms"
            Error: <| show_error |>
          }
          Checkbox {  # empty while only some are on
            Checked: <| some_read |>
            Label: "Select all"
          }
        }
      }
    python: |
      from tess_ui.widgets import checkbox

      agree = checkbox(app.window, (0xFF, 0xFF, 0xFF, 0xFF), 48, 48, checked=False)
      agree.checked.get()
    see: [guide/controls.md]

  - slug: radio-buttons
    title: Radio button
    group: Selection and input
    widgets: [RadioButton]
    md3: |
      A radio button lets the user choose one option from a set. Radio buttons in one group exclude each other,
      and the arrow keys move between them.
    built: |
      `RadioButton`, a Tesserae control: a 20 pixel ring with a dot that grows in when it is chosen. Radio buttons with one `Group:` name share a group: choosing
      one unchooses the others, the group is one Tab stop (the chosen one, else the first that is not disabled), and the arrow keys move the choice (and the focus) to the next or
      previous button that is not disabled, wrapping round. A press on a chosen one does not unchoose it. The `Label` sits beside the ring and is part of what you press.

      To keep the choice in one value, test it in `Selected` and set it in `On_Change`: `Selected: "<| size == 'm' |>"`, `On_Change: "size = 'm'"`.
    usage_view: |
      Container {
        Name: sizes
        Style { Flex_Direction: vertical, Gap: 4, Width: 240, Height: 180, Padding: 16 }
        Children {
          RadioButton {
            Group: size
            Label: Small
            Selected: <| size == 's' |>
            Handlers {
              On_Change { Set { Target: size, Value: <| 's' |> } }
            }
          }
          RadioButton {
            Group: size
            Label: Medium
            Selected: <| size == 'm' |>
            Handlers {
              On_Change { Set { Target: size, Value: <| 'm' |> } }
            }
          }
          RadioButton {
            Group: size
            Label: Large
            Selected: <| size == 'l' |>
            Handlers {
              On_Change { Set { Target: size, Value: <| 'l' |> } }
            }
          }
        }
      }
    python: |
      from tess_ui.controls import RadioGroup
      from tess_ui.widgets import radio_button

      group = RadioGroup()
      small = radio_button(app.window, 48, selected=True, group=group)
    see: [guide/controls.md]

  - slug: switches
    title: Switch
    group: Selection and input
    widgets: [Switch]
    md3: |
      A switch toggles one setting on or off, and takes effect at once. It has a track and a thumb that grows when
      it is on.
    built: |
      `Switch`, a Tesserae control: a 52 by 32 pixel track and a handle that slides across it and grows when pressed (16 pixels off, 24 on, 28 pressed). The `Label` sits beside
      the track and is part of what you press. With `Icons: true` the handle carries a check when on and a cross when off, and the off handle is then as big as the on one. Space or
      Enter toggles it from the keyboard, and `Handlers { On_Change: ... }` runs after the user toggles it.
    usage_view: |
      Container {
        Name: settings
        Style { Flex_Direction: vertical, Gap: 8, Width: 240, Height: 140, Padding: 16 }
        Children {
          Switch {
            Selected: <| wifi |>
            Label: Wi-Fi
          }
          Switch {
            Selected: <| dark |>
            Label: "Dark mode"
            Icons: true
          }
        }
      }
    python: |
      from tess_ui.widgets import switch

      dark = switch(app.window, selected=False)
    see: [guide/controls.md]

  - slug: sliders
    title: Slider
    group: Selection and input
    widgets: [Slider, RangeSlider]
    md3: |
      A slider lets the user pick a value from a range by dragging a handle, or with the keyboard.
    built: |
      `Slider`, a Tesserae control: a 4 pixel track, a 20 pixel handle and a 40 pixel state layer in a 48 pixel target. A bound `Value` follows the drag, not only its end.
      With a `Step` the value snaps to multiples of it from `Min`, the keys move by it (else by a hundredth of the range), and `Ticks: true` puts a mark at each step: a discrete
      slider (without a `Step` there is nothing to mark). `Value_Indicator: true` shows a bubble with the value over the handle while it is dragged or has the keyboard focus.
      A `Max` that is not above `Min`, or a `Step` that is not positive, is an error.

      Three looks go beyond the standard one. `Vertical: true` stands it up: the bottom is `Min`, `Style.Height` is its length and `Style.Width` the touch target's. `Size`
      (`xs`, `s`, `m`, `l` or `xl`) is the Expressive form: a track 16, 24, 40, 56 or 96 pixels thick, in two pieces with a 6 pixel gap either side of a thin 4 pixel handle that
      stands across it. `Icon` insets a glyph at the start of the track (it needs a `Size` of `s` or larger) in the colour of what it lies on.

      Events: `on_input` while it is dragged (every step), `On_Change` once it is let go, and after each key. Dragging captures the pointer, and a press anywhere on the track
      sets the value there. The arrow keys step it (all four, whichever way it lies), Page Up and Down move by ten steps, Home and End go to the ends, and a screen reader can
      increment, decrement and set it. The colour is `Style.Foreground` and the length is `Style.Width` (`Style.Height` when `vertical`); a slider laid out longer or shorter than
      it was built, in a flexible row, takes the room it was given.

      ### Range slider

      `RangeSlider` picks two values, a least and a most, with two handles. It takes the slider's `Min`, `Max`, `Step`, `Ticks`, `Value_Indicator`,
      `vertical`, `Size`, `Icon`, `Label` and `Disabled`, and, in place of `Value`, two two-way numbers: `Low`, the least of the two, and `High`, the most. A `High` below
      `Low` is read as `Low`.

      The handles never cross: a drag stops at the other handle. Each handle is its own stop for Tab, has its own state layer and focus ring and, for a
      screen reader, is a slider of its own (named from `Label`: "Price, minimum" and "Price, maximum"; its reach is up to or down from the other handle).
      The arrow, Page Up and Down keys move the handle that has the focus; Home and End take it to the end of what it may reach. A press on the track moves the
      nearer handle there, and a drag keeps hold of the handle it began on. The track between the handles is `primary`; with a `Size` it is three pieces, a gap
      from each handle. `on_input` and `On_Change` fire as for a slider; read the values from the bound `Low` and `High`.
    usage_view: |
      Container {
        Name: player
        Style { Flex_Direction: vertical, Gap: 16, Width: 280, Height: 160, Padding: 16 }
        Children {
          Slider {
            Value: <| volume |>
            Min: 0
            Max: 100
            Label: Volume
            Value_Indicator: true
            Style { Width: 240 }
          }
          Slider {
            Value: <| stars |>
            Min: 1
            Max: 5
            Step: 1
            Ticks: true
            Style { Width: 240 }
          }
          RangeSlider {
            Low: <| cheapest |>
            High: <| dearest |>
            Min: 0
            Max: 500
            Step: 10
            Label: Price
            Style { Width: 240 }
          }
        }
      }
    python: |
      from tess_ui.widgets import slider

      volume = slider(app.window, (0xFF, 0xFF, 0xFF, 0xFF), 240, 44, value=0.5)
      volume.on_change(print)
    see: [guide/controls.md]

  - slug: chips
    title: Chips
    group: Selection and input
    views: [Chip, ChipGroup]
    md3: |
      Chips are compact elements for an action, a filter, a piece of input, or a suggestion. **Assist** chips
      start an action, **filter** chips narrow results (and show a check when selected), **input** chips are
      things the user entered, and **suggestion** chips offer a reply or next step.
    built: |
      `Chip` is a view Tesserae ships (`Chip_View.tdl`): 32 pixels tall with 8 pixel corners, as wide as its label. `ChipGroup` is a wrapping row of
      them.

      A chip has a leading 18 pixel `Icon`, or `Avatar_Text`: letters in a 24 pixel circle. A filter or input chip that is `Selected` is `secondary_container` with no outline, and
      a filter chip also shows a check in place of its icon. `elevated` swaps the outline for a raised surface. A `Removable` chip (an input chip) has a close button: pressing it
      sets `Removed` to true and runs `On_Remove`. A filter chip is a checkbox to a screen reader and the others are buttons; a disabled chip is dimmed and not focusable.

      A filter chip flips `Selected` itself (`Flip: false` leaves that to you); `Handlers { On_Click: ... }` on the call is what a press does. A `ChipGroup` takes
      `Chips` (`{Value, Label}` and optionally `{Icon, Avatar_Text, Disabled}`) and a `Mode`: `none` (assist or suggestion chips; the last pressed goes to
      `Chosen`), `single` or `multiple` (filter chips; `Selected` is the value or the list of values), or `input` (chips with a close, and a field: Enter adds a
      chip, the close removes one, and `Chips` is two-way; `Entry` is what is typed and `Placeholder` its hint). In `none` mode `Variant` is `assist` or `suggestion`, and
      `elevated` raises every chip. The group is one Tab stop and the arrow keys move the focus along the chips (in `single` mode the focus carries the choice with it). Not built:
      dragging chips to reorder, and a chip group that scrolls sideways.
    usage_view: |
      Container {
        Name: filters
        Style { Flex_Direction: vertical, Gap: 16, Width: 420, Height: 240 }
        Children {
          Chip {
            Label: Share
            Icon: home
            Handlers {
              On_Click: share
            }
          }
          ChipGroup {
            Mode: multiple
            Selected: <| filters |>
            Chips {
              Item { Value: open, Label: Open }
              Item { Value: mine, Label: Mine }
              Item { Value: late, Label: Overdue }
            }
          }
          ChipGroup {
            Mode: input
            Chips: <| tags |>
            Entry: <| typed |>
          }
        }
      }
    python: |
      from tess_ui.widgets import chip

      shipped = chip(app.window, "Shipped", 96, variant="filter", selected=True)

  - slug: text-fields
    title: Text fields
    group: Selection and input
    views: [TextField]
    widgets: [TextInput]
    md3: |
      A text field lets people enter and edit text. Material Design 3 has two kinds: a **filled** field, a tinted container with a line under
      it, and an **outlined** one, a field with a border. The label is the field's name: it sits in the middle as a hint and moves up, smaller,
      when the field has focus or text. Supporting text, a character counter, icons before and after, and an error state with its message
      belong to the field.
    built: |
      `TextField` is a view Tesserae ships (`TextField_View.tdl`) with its look as rules (`TextField_Stylesheet.tdl`). It is built from
      the `TextInput` widget, the bare input, and the nodes around it, so every part has a name a stylesheet can address.

      `Text` is two-way: give it a bare reference and typing writes it. `Placeholder` shows while the field is empty and has focus (or has no label). `Supporting` is help under the
      field, and `Error` is a message that gives the field the error look and replaces the supporting text. `Leading` and `Trailing` are icons (an error replaces the trailing one),
      `Prefix` and `Suffix` are text around the typing, such as `$` and `USD`, and `Counter` shows how many characters are typed, of `Max_Length` when there is one (`0` is no limit).
      `Multiline` makes Enter start a new line; `Obscured` makes a password (dots, with a button that shows the text); `Read_Only` lets the text be selected and copied but not
      changed. `Mask` fits what is typed to a pattern (`###-####`: `#` a digit, `A` a letter, `*` either, `\` a literal). `Suggestions` is a list of texts: those that contain
      what is typed show in a menu under the field (up to six), pressing one fills the field in, and Escape closes the menu.

      Events: `on_key` for each key pressed in the field, `On_Edit` after each edit (once `Text` has been written), and `on_submit` for Enter in a field that is not
      multiline.

      **Typing effects.** `Typing_Effect: flash` tints the characters just typed with the primary colour and lets the tint fade (about a quarter of a second);
      `fade_in` covers them in the background colour and lets that fade, so they seem to appear. Each is drawn exactly over what was inserted (a paste over
      several lines gets a piece on each line), from the geometry the engine reports for the edit. The background `fade_in` uses is the first opaque fill going up from the
      input, else the theme's `surface`. `Caret_Effect: glide` hides the engine's caret and draws one of Tesserae's own, which eases to each new place in about an eighth
      of a second, stays solid while you type and blinks after a moment, and shows only while the field has the focus. When the app asks for reduced motion there is no
      flash and no fade, and the caret jumps and does not blink. Neither takes the pointer or appears to a screen reader.

      Five more properties tune them, each the field's own to set. `Typing_Duration` is how long a flash or a fade-in lasts, in milliseconds (260 for a flash and 180 for a fade-in
      when left out; `0` leaves the effect out). `Flash_Color` is what a flash is tinted with: a theme role or a colour (`tertiary`, `#FF8800`, `primary@50%`), the primary colour
      when left out. `Flash_Opacity` is how strong a flash starts, `0` to `1` (`0.24` when left out). `Glide_Duration` is how long the gliding caret takes to reach its new place
      (`120` when left out; `0` makes it jump), and `Caret_Blink` is how long it is on, then off (`530` when left out; `0` keeps it solid). A number below `0`, or a strength outside
      `0` to `1`, is an error that names the property and the line. The easing is not settable.

      The parts a stylesheet can address are `box`, `label`, `input`, `prefix`, `suffix`, `leading_icon`, `trailing_icon`, `error_icon`,
      `reveal_button`, `reveal_icon`, `indicator` (the line under a filled field), `supporting` and `counter`. The state of a rule is the state of
      the whole field: `focused` is true while anything inside it has the focus, `hovered` while the pointer is over it, and `Error` and
      `Disabled` read the field's own properties. The label glides between its two places (its position eases in 150 milliseconds; its size changes at once, as the
      engine cannot ease a font size). A filled field has 4 pixel top corners and a square bottom, over its line. The input says it is described by the help line, so a
      screen reader reads that too, and it is invalid while there is an error. Not built: moving into the suggestions with the arrow keys (press one with the pointer), the input method's
      composition drawn by Tesserae (the engine draws the candidate window at the caret), and an exposed dropdown that is a select.
    usage_view: |
      Container {
        Name: signup
        Style { Flex_Direction: vertical, Width: 360, Height: 420, Gap: 16, Padding: 16 }
        Children {
          TextField {
            Name: email
            Label: Email
            Leading: search
            Text: <| email |>
            Error: <| email_error |>
            Supporting: "We never share it"
            Handlers {
              On_Submit: sign_up
            }
          }
          TextField {
            Name: password
            Variant: outlined
            Label: Password
            Obscured: true
            Text: <| password |>
          }
          TextField {
            Name: bio
            Label: "About you"
            Multiline: true
            Max_Length: 140
            Counter: true
            Text: <| bio |>
          }
        }
      }
    after: |
      `TextInput` is the bare input, for when the field around it is your own: `text`, `Placeholder`, `Multiline`, `Obscured`, `Max_Length`,
      `Read_Only`, `Disabled`, `Mask`, the typing and caret effects above (`Typing_Effect`, `Caret_Effect` and the five that tune them) and the font (`Typography_Role`,
      `Font_Family`, `Font_Size`, `Font_Weight`); its colour is `Style.Foreground`. A `TextInput` needs a `Style.Background` and a `Typography_Role` (or `Font_Family`): without them the view does not build.

      ## Changing its look

      Write rules for `TextField` in your app's stylesheet; they sit above the shipped ones, and a `Style:` on the node beats every rule for the
      fields it sets.

      ```tdl
      Styles {
        Rule {
          Widget: TextField
          Part: box
          Variant: filled
          Style { Background: surface_container_high, Corner_Radius: 12 }
        }
        Rule {
          Widget: TextField
          Part: indicator
          State: focused
          Style { Background: tertiary }
        }
      }
      ```

      A view named `TextField_View.tdl` in your project replaces the shipped field, and its shipped look with it.
    see: [guide/view-language.md, guide/bindings.md]

  - slug: spin-boxes
    title: Spin box
    group: Selection and input
    views: [SpinBoxField]
    widgets: [SpinBox]
    md3: |
      Material Design 3 has no spin box. Tesserae's is built from MD3's parts: a number field between two 40dp
      icon buttons.
    built: |
      The `SpinBox` kind (`SpinBox` in a view), a Tesserae control: a 64 by 40 pixel number field between two 40 pixel buttons. The buttons, the up and down arrow keys in the
      field and a screen reader's increment and decrement change `Value` by `Step`; typing a number sets it once it parses and fits `Min` to `Max`, and leaving the field puts the
      value's text back if what was typed did not. A button whose step would pass a bound is disabled, unless `Wrap` is on (it needs `Min` and `Max`): then a step past one bound
      lands on the other and the buttons never disable. `Decimals` fixes how many places show (without it, only as many as the number needs). `Prefix` and `Suffix` (a currency sign,
      a unit) are shown with the number, and typing may include them or not. `Label` is the name for a screen reader.

      Holding a button steps again after 400 milliseconds and then every 80, until it is let go or reaches a bound; Page Up and Page Down step ten at a time.
      `SpinBoxField` is a view Tesserae ships that adds a visible `Label` above and a line of `Supporting` or `Error` text under it (`Least` and `Most` are its
      bounds, `Min` and `Max` being reserved names). Not built: a hold that speeds up the longer it is held, and a spin box in a vertical arrangement.
    usage_view: |
      Container {
        Name: order
        Style { Flex_Direction: vertical, Gap: 16, Width: 320, Height: 240 }
        Children {
          SpinBox {
            Value: <| count |>
            Min: 0
            Max: 10
            Label: Count
          }
          SpinBoxField {
            Label: Weight
            Value: <| weight |>
            Least: 0
            Most: 50
            Step: 0.5
            Decimals: 1
            Suffix: " kg"
            Supporting: "Up to 50"
          }
        }
      }
    python: |
      from tess_ui.widgets import spin_box

      quantity = spin_box(app.window, 1, min=0, max=10)
    see: [guide/controls.md]

  - slug: date-pickers
    title: Date picker
    group: Selection and input
    views: [DatePicker, DatePickerDay]
    md3: |
      A date picker lets the user pick a date from a month grid. Today is outlined, the chosen day is a filled
      circle, and days of the neighbouring months are dimmed.
    built: |
      Two views Tesserae ships: `DatePickerDay` (one day, in all its states) and `DatePicker` (the modal dialog).

      `DatePicker`'s `Open` is two-way (Escape and a press on the scrim close it). `Date` is text, `year-month-day` ("2026-10-09", or empty for none), also two-way, and it changes only
      when OK is pressed. The days before `Earliest` and after `Latest` are disabled, `Week_Starts` is `sunday` (the default) or `monday`, and `On_Ok` is called after OK.

      The dialog shows the chosen date in `headline_large` and a keyboard button that swaps the grid for a typed field (`####-##-##`; text that is not a real day is left out), the month with arrows between months, the
      weekday initials, six weeks of days, and Cancel and OK. Today is outlined, the chosen day is a `primary` circle, and the days of the months either side are faint and move
      the view to their month when pressed. The arrow keys move around the grid. A `DatePickerDay` has `Day`, `Selected`, `Today`, `Outside` and `Disabled`. The dates are worked out with
      the expression language's `date_add_days`, `date_weekday`, `days_in_month`, `format_date` and `current_date`, which are there for any view. Not built: a range picker,
      a docked picker under a field, month and year selectors, Page Up and Page Down by month, and the names of the months and days in another language.
    usage_view: |
      Container {
        Name: booking
        Style { Width: 480, Height: 640 }
        Children {
          DatePicker {
            Open: <| choosing |>
            Date: <| day |>
            Earliest: "2026-01-01"
          }
          DatePickerDay {
            Day: "7"
            Selected: true
          }
        }
      }
    python: |
      from tess_ui.widgets import date_picker_day

      day = date_picker_day(app.window, 7, selected=True)

  - slug: time-pickers
    title: Time picker
    group: Selection and input
    views: [TimePicker, PeriodSelector]
    widgets: [TimePickerDial]
    md3: |
      A time picker lets the user choose an hour and a minute on a dial, with an AM/PM selector in a 12-hour
      format.
    built: |
      Four pieces. `TimePickerDial` is a Tesserae control (`TimePickerDial`): `Hour`, `Minute` and `Mode` (`hour` or `minute`; letting go on an hour moves on to the
      minutes unless `Auto_Advance` is off; the arrow keys step the hour by one or the minute by five, and a screen reader can increment and decrement it). `PeriodSelector` is a view: two 40 pixel halves, `Period` `AM` or `PM` (two-way), with an `On_Change` handler for after a choice; it is one Tab stop and the up and down arrows move and choose.
      `TimeInput` is a view: an hour field, a colon, a minute field and, in 12-hour time, a period selector, where `Hour` and `Minute` are two-way and a number that does
      not fit is left out (the fields are filled from the time when they appear). `TimePicker` is the dialog of Material 3.

      `TimePicker`'s `Open` is two-way (Escape and a press on the scrim close it). `Hour` (0 to 23) and `Minute` are two-way and change only when OK is pressed; Cancel, Escape and the
      scrim leave them. `Twelve` (the default) is 12-hour time with a dial and a period selector; `Twelve: false` opens straight on the typed fields, with no dial and no keyboard
      button. `On_Ok` is called after OK.

      The picker shows the time as an hour and a minute you press to choose which the dial sets, the period selector, the 256 pixel dial, a keyboard button that
      swaps the dial for the typed fields (and back), and Cancel and OK. Reopening it starts from the time as it then is. Not built: a 24-hour dial with an inner ring,
      limits on the times that can be chosen, and the times as a locale writes them.
    usage_view: |
      Container {
        Name: alarm
        Style { Width: 480, Height: 520 }
        Children {
          TimePicker {
            Open: <| choosing |>
            Hour: <| alarm_hour |>
            Minute: <| alarm_minute |>
            On_Ok: alarm_set
          }
          TimeInput {
            Hour: <| alarm_hour |>
            Minute: <| alarm_minute |>
          }
          PeriodSelector {
            Period: <| half |>
          }
        }
      }
    python: |
      from tess_ui.widgets import time_picker_dial

      dial = time_picker_dial(app.window, hour=9, minute=30)
    see: [guide/controls.md]

  - slug: colour-pickers
    title: Colour picker
    group: Selection and input
    views: [ColourPicker, ColourPickerPanel]
    widgets: [ColourArea, ColourStrip, ColourField, ColourSwatches]
    md3: |
      Material Design 3 has no colour picker of its own: it chooses colours for an app's theme, not for the content in it. A colour picker is how a person chooses a colour for
      something they make, here from a square of saturation and value, a strip of hues and a strip of alpha, as colour editors do, and from the colours of the theme.
    built: |
      Two views and four controls. `ColourPicker` is the view you use: the picker inline, or (`Popup: true`) a 40 pixel swatch of the colour that opens it in a layer next to it.
      `ColourPickerPanel` is the inside of it, with no surface and no trigger, for an app that lays the parts out itself. `ColourArea`, `ColourStrip`, `ColourField` and
      `ColourSwatches` are Tesserae controls (`tess_ui.colour_controls`): the parts of the panel, each of which can be used alone.

      `Value` is the colour as text, and is two-way: `'#rrggbb'`, or `'#rrggbbaa'` when the alpha is below 1 (lowercase; a fully opaque colour never has the alpha digits). Capitals
      are read and written back in lowercase, and anything else (`#fff`, `red`) is an error that names the widget. Every part reads and writes the one text, so they stay in step, and
      setting a value and reading it back gives the same text. The square and the strips are drawn with the engine's gradients.

      The square (`ColourArea`) is saturation across and value up, for the hue; a press or a drag sets both and keeps the hue and the alpha. The hue strip (`ColourStrip` with
      `Channel: hue`) runs through the rainbow from 0 to 360 degrees and the alpha strip (`Channel: alpha`) from clear to the colour over a chequerboard, from 0 to 100 percent.
      A grey and a black have no hue of their own, so the picker remembers the hue (`Hue`, a number of degrees the square and the hue strip share) and keeps it while the text still
      agrees with it: a drag to a corner and back, or through white or black, ends at the hue it began with, and a drag of the hue strip leaves the saturation and value as they were.

      The hex field (`ColourField` with `Channel: hex`) takes `#rrggbb` or `#rrggbbaa`, and the red, green, blue and alpha fields a whole number from 0 to 255. What is typed sets the value
      at once while it is a colour; while it is not, the value stays as it was and the field is drawn in the error colours and tells a screen reader it is invalid. Leaving the field, or
      Escape, puts back the text of the value. The up and down arrows step a number by one, by ten with Shift. The swatches (`ColourSwatches`) are the theme's colour roles, by default
      `primary`, `secondary`, `tertiary`, `error`, `surface`, `on_surface`, `primary_container` and `secondary_container` (`Roles` names others); pressing one sets the value to that
      role's colour, opaque, and the swatch whose colour is the value's is drawn selected.

      With `Popup: true`, `Open` is two-way: pressing the swatch opens the picker, and Escape or a press outside closes it and writes false to `Open` (pressing the swatch again closes it too).
      A disabled picker does not open. `On_Change` is called after each change the user makes, while a drag is still going; changes the app makes by setting the value do not call it.

      The keyboard: Tab goes square, hue, alpha, the hex field, red, green, blue, alpha, then each swatch. The arrow keys move the point of the square by a hundredth of saturation or
      value, by a tenth with Shift; Page Up and Page Down move the value by a tenth; Home and End take the saturation to its ends. On a strip the arrows move a degree or a percent (ten
      with Shift), Page Up and Page Down ten, and Home and End go to the ends. Left and Right move between swatches. For a screen reader the square is a slider that says "saturation 40 percent,
      value 80 percent", the hue strip one in degrees and the alpha strip one in percent, each can be incremented, decremented and set, and the whole picker is a group named by `Label`.

      The look is in `ColourPicker_Stylesheet.tdl`: write one in your project to change the swatch and the layer. The swatch has the state layer, ripple and focus ring of a pressable node and
      a disabled picker fades to 38%. Not built: a picker that follows a drag to the alpha digits of a colour written with `rgb()`, other colour spaces (HSL, OKLCH), an eyedropper,
      a recent-colours row, and a swatch row that shows the theme's colours of the other mode.
    usage_view: |
      Container {
        Name: paint
        Style { Flex_Direction: horizontal, Gap: 24, Width: 640, Height: 560, Padding: 16 }
        Children {
          ColourPicker {
            Value: <| fill |>
            On_Change: recolour
          }
          Container {
            Style { Flex_Direction: vertical, Gap: 8 }
            Children {
              ColourPicker {
                Popup: true
                Open: <| choosing |>
                Value: <| fill |>
                Label: "Fill colour"
              }
              ColourPicker {
                Popup: true
                Open: <| choosing_line |>
                Value: <| line |>
                Label: "Line colour"
                Roles: [primary, error, on_surface]
              }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import colour_area, colour_field, colour_strip

      area = colour_area(app.window, "#3366cc", x=16, y=16)
      hue = colour_strip(app.window, "hue", "#3366cc", x=16, y=204)
      hex_field = colour_field(app.window, "hex", "#3366cc", x=16, y=240)
      area.on_input(lambda text: hex_field.value.set(text))
    see: [guide/controls.md, guide/widget-catalog.md]

  - slug: icon-pickers
    title: Icon picker
    group: Selection and input
    views: [IconPicker, IconPickerPanel]
    widgets: [IconBrowser]
    md3: |
      Material Design 3 has no icon picker: icons are chosen by the people who design an app. An app whose people pick an icon for something (a launcher, a button, a block of a configuration)
      needs one, and it is built from what MD3 does describe: an outlined text field for the search, a grid of selectable items, and a menu-like surface that holds them.
    built: |
      Two views and one control. `IconPicker` is the view you use: the picker inline, or (`Popup: true`) a 48 pixel button that shows the icon and its name and opens the picker in a layer under it.
      `IconPickerPanel` is the inside of it, with no surface and no button. `IconBrowser` is the control that draws nothing and is the picker's mind (`tess_ui.icon_controls`): the list, the search,
      the cursor and the previews, which the view reaches through the names it binds to it.

      The icons are the curated set of `tess_ui.icons` (Material Symbols and Material Design Icons, by name) and, when `Icons_Folder` is given, the `.svg` and `.png` files in that folder, which come
      first. `Value` is two-way text: a built-in icon's name (`home`), or a file's name with its extension (`logo.svg`). A value that is not an icon the picker knows is kept as it is and nothing is
      selected. The folder is read through `tess_ui.filesystem`, once when the grid opens (a popup reads nothing until it does); a folder that cannot be read is a message under the grid, and the built-in
      icons stay. A file is shown as its picture: an SVG is drawn in the text colour where it says `currentColor`, a PNG is scaled down to fit. A file is read only when its row comes into view, a file
      that is not an SVG or a picture is shown as a plain file glyph, and a document type or entity declaration in an SVG is refused.

      The search field keeps the icons whose name has every word of what is typed, in any order, without regard to case, with `_`, `-` and `.` counted as spaces (`arrow back` finds `arrow_back`, `svg`
      finds `logo.svg`); a name that starts with the first word comes first. The grid is a `VirtualList` of rows of `Columns` icons (8 by default), `Rows` of them in view (6): it builds the rows in view and
      three past each edge, however many icons there are, and a new search makes new rows rather than patching the old ones. It opens scrolled so that `Value` shows, with the cursor on it.

      The keyboard. The search field has the focus when a popup opens: Up, Down, Page Up and Page Down move the cursor in the grid and Enter picks the icon under it (Left, Right, Home, End and Space are the
      text's). Tab goes on to the grid, where the arrow keys move by an icon and by a row, Home and End go to the start and end of the row (with Ctrl, of the whole grid), Page Up and Page Down go `Rows` rows,
      and Enter and Space pick. The grid scrolls to keep the cursor in view. A press picks too. A pick writes `Value`, calls `On_Change`, and closes a popup unless `Close_On_Pick` is false. Escape and a
      press outside close a popup (writing false to `Open`), and the focus goes back to the button. A screen reader hears a group named by `Label`, a `list` of `listitem`s each named by its icon and
      `Selected` when it is the value, the search field, a button that says "label: icon" and is `Expanded` while the layer is open, and an alert for a folder that cannot be read or a search that finds nothing.

      The look is in `IconPicker_Stylesheet.tdl` and `IconPickerPanel_Stylesheet.tdl`: write one in your project to change the button, the layer and the cells. Not built: icon categories or
      tags, recently used icons, other file types (`.jpg`, `.webp`), an icon's own colour for a PNG, sizes other than 24 pixels.
    usage_view: |
      Container {
        Name: blocks
        Style { Flex_Direction: vertical, Gap: 16, Width: 480, Height: 640, Padding: 16 }
        Children {
          IconPicker {
            Popup: true
            Open: <| choosing |>
            Value: <| icon |>
            Icons_Folder: "~/.config/myapp/Icons"
            Label: "Launcher icon"
            On_Change: icon_changed
          }
          IconPicker {
            Value: <| icon |>
            Columns: 6
            Rows: 4
          }
        }
      }
    see: [guide/controls.md, components/colour-pickers.md]

  - slug: font-lists
    title: Font list
    group: Selection and input
    views: [FontList, FontListPanel]
    widgets: [FontBrowser]
    md3: |
      Material Design 3 has no font picker: an app's type is chosen by its designers. An app whose people pick a typeface for something (a launcher, a terminal, a block of a configuration)
      needs one, and it is built from what MD3 does describe: an outlined text field for the search and a list of selectable rows on a menu-like surface.
    built: |
      Two views and one control. `FontList` is the view you use: the list inline, or (`Popup: true`) a 48 pixel button that shows the family, in its own face, and opens the list in a layer under it.
      `FontListPanel` is the inside of it, with no surface and no button. `FontBrowser` is the control that draws nothing and is the list's mind (`tess_ui.font_controls`): the families, the search and the cursor,
      which the view reaches through the names it binds to it.

      The families come from `tess_ui.font_families`: by default `fc-list : family`, a read-only subprocess given five seconds, whose lines are split on newlines and commas (each line holds a family and its names
      in other languages), trimmed, de-duplicated (a name that differs only in case is the same family) and sorted without regard to case. It runs once, when the first list is built, and the answer is
      kept (`font_families.refresh()` asks again). `font_families.use(provider)` swaps the source: `provider()` returns the names or raises `FontListError`, which a test or an app that knows its fonts uses.
      The list is the families installed on the machine: the faces the engine ships (`Roboto`, `Noto Sans Arabic`, `Hack Nerd Font Mono`) are in it only where the machine has them too. A machine with no `fc-list`,
      or one where it fails, takes more than five seconds or lists nothing has no list: the view shows an outlined text field for the family's name, with the reason under it, in place of the search, the list
      and (with `Popup`) the button and the layer.

      A row is the family's name, drawn in that family when the engine can draw it (a family `tess_ui.fonts.available_families()` knows: the bundled ones and any registered with `register_font`) and in the ordinary
      face when it cannot, since the engine does not look for system fonts. `Value` is two-way text: the family's name. A value that is not an installed family is kept as it is and nothing is selected. The search
      field keeps the families whose name has every word typed, in any order, without regard to case; a name that starts with the first word comes first. The list is a `VirtualList` of `Rows` rows (8 by default): it
      builds the rows in view and three past each edge, however many families there are (seven thousand open at once), and opens scrolled so that `Value` shows, with the cursor on it.

      The keyboard. The search field has the focus when a popup opens: Up, Down, Page Up and Page Down move the cursor in the list and Enter picks the family under it (Left, Right, Home, End and Space are the text's).
      Tab goes on to the list, where Up and Down move by a row, Page Up and Page Down by `Rows`, Home and End go to the ends, and Enter and Space pick. A press picks too. A pick writes `Value`, calls `On_Change`
      and closes a popup unless `Close_On_Pick` is false. Escape and a press outside close a popup (writing false to `Open`), and the focus goes back to the button. A screen reader hears a group named by `Label`,
      a `list` of `listitem`s each named by its family and `Selected` when it is the value, the search field, a button that says "label: family" and is `Expanded` while the layer is open, and an alert for a search
      that finds nothing.

      The look is in `FontList_Stylesheet.tdl` and `FontListPanel_Stylesheet.tdl`: write one in your project to change the button, the layer and the rows. Not built: a sample sentence in each row, favourites or
      recently used families, grouping by foundry or script, weights and styles of a family, and system fonts the engine cannot draw (they are listed, in the ordinary face).
    usage_view: |
      Container {
        Name: terminal
        Style { Flex_Direction: vertical, Gap: 16, Width: 480, Height: 560, Padding: 16 }
        Children {
          FontList {
            Popup: true
            Open: <| choosing |>
            Value: <| family |>
            Label: "Terminal font"
            On_Change: font_changed
          }
          FontList {
            Value: <| family |>
            Rows: 6
            Width: 320
          }
        }
      }
    python: |
      from tess_ui import font_families

      # the default asks `fc-list : family` once; an app that knows where its fonts are can say so
      font_families.use(lambda: ["Alegreya", "Fira Code", "Hack Nerd Font Mono"])
    see: [guide/controls.md, components/icon-pickers.md]

  - slug: key-chord-fields
    title: Key chord field
    group: Selection and input
    views: [KeyChordField]
    widgets: [ChordRecorder]
    md3: |
      Material Design 3 has no field for a keyboard shortcut. An app whose people set their own shortcuts needs one, and it is built from an outlined text field and a button that records.
    built: |
      `KeyChordField` is a view Tesserae ships (`KeyChordField_View.tdl`): an outlined text field that holds the chord as text, and a button beside it that records one. `ChordRecorder` is the
      control that draws nothing and is its mind (`tess_ui.chord_controls`), and `tess_ui.key_chords` has the rules for the text.

      The text is `Ctrl+Alt+Shift+Meta+Key`: the modifiers that are held, always in the order Ctrl, Alt, Shift, Meta, and then one key, last, the parts joined by `+`: `Ctrl+Shift+F1`, `Alt+Left`, `Meta+Space`. A named
      key is in title case (`Escape`, `Enter`, `Backspace`, `Tab`, `Space`, `Delete`, `Insert`, `Home`, `End`, `PageUp`, `PageDown`, `Left`, `Right`, `Up`, `Down`, and `Plus`, `Minus`, `Comma`, `Period` for
      the characters that cannot be written in a `+`-joined text); a function key is `F1` to `F24`; a letter is a capital; any other single character is itself. `Value` is two-way text; empty is no shortcut.

      Recording. Press the button (or Tab to it and press Enter or Space) and it takes the next key press as the chord: it says "Press keys", and shows the modifiers held so far (`Press keys Ctrl+Shift+`) while the
      person holds them. A modifier on its own (Shift, Control, Alt, Meta, a lock) never finishes the chord. A key that is not one finishes it: the chord is written to `Value`, `On_Change` is called, and the field
      shows it. Escape on its own cancels and leaves the chord as it was; Backspace on its own clears it (`Value` is empty and `On_Change` is called); with a modifier they are chords like any other
      (`Ctrl+Escape`). While recording, Enter and Space are chords too. A key that no chord can have (`print_screen`) is named under the field and the recording goes on. Leaving the button ends a recording. `Recording` is
      two-way: set it true to start one from the app, and a finished or cancelled recording writes false.

      Typing. The text in the field is read when Enter is pressed or the field is left, never per key. It is read in any case and in the usual names (`ctrl+shift+f1`, `Control + Return`, `super+pgup`, `Esc`,
      `Del`, `arrow_left`): a chord is written back in the canonical form (`Ctrl+Enter`). Anything else is refused: `Value` stays as it was, the field is drawn in the error colours with the reason under it, and what was typed
      stays to be mended. The media and hardware keys are written with the X key names without their `XF86` prefix (`AudioRaiseVolume`, `AudioLowerVolume`, `AudioMute`, `AudioMicMute`, `AudioPlay`, `AudioPause`, `AudioStop`, `AudioNext`, `AudioPrev`, `MonBrightnessUp`, `MonBrightnessDown`): recording one writes that name, and typing it with the prefix (`XF86AudioMute`) is read and written back without it. Typing nothing clears the shortcut. A value the app sets is shown as it is and never rewritten: `ctrl+shift+f1` stays so until the person commits it, and a value that is not a chord is shown in
      the error colours and kept. The disabled field records and reads nothing.

      A screen reader hears a group named by `Label`, the field with that label (and the error), and a button that says "Record label", or while recording "Recording label: press the keys, Escape cancels, Backspace clears",
      and is `pressed` while it does. The field and the button are in the Tab order. The look is in `KeyChordField_Stylesheet.tdl`: write one in your project to change the button, which is `primary_container` while it records.
      Not built: several chords for one action, a chord of two steps (`Ctrl+K Ctrl+S`), a list of the chords already taken, and key names for the keys the engine reports but this table does not know (a keypad, the media keys).
    usage_view: |
      Container {
        Name: shortcuts
        Style { Flex_Direction: vertical, Gap: 16, Width: 560, Height: 240, Padding: 16 }
        Children {
          KeyChordField {
            Value: <| reveal |>
            Label: "Reveal key"
            On_Change: reveal_changed
          }
          KeyChordField {
            Value: <| cycle |>
            Label: "Cycle surface"
          }
        }
      }
    python: |
      from tess_ui import key_chords

      key_chords.normalise("control + return")                 # 'Ctrl+Enter'
      key_chords.normalise("Ctrl+Shift")                       # None: no key
      key_chords.from_event("arrow_left", alt=True)            # 'Alt+Left'
    see: [guide/controls.md, components/text-fields.md]

  - slug: list-editors
    title: List editor
    group: Selection and input
    views: [ListEditor, ListEditorRow]
    widgets: [ListModel]
    md3: |
      Material Design 3 has no editor for a list of values. An app whose people keep a list (the words of a launcher's filter, the outputs of a layout, the colours of a palette) needs one, and it is built from what MD3
      does describe: a column of rows, each with a field of its own kind and icon buttons to move and remove it, and a button that adds.
    built: |
      Two views and one control. `ListEditor` is the view you use. `ListEditorRow` is one of its rows, and `ListModel` is the control that draws nothing and is the editor's mind (`tess_ui.list_controls`: the items,
      the edits and the identity of each item, which the view reaches through the names it binds to it).

      `Value` is a Python list, two-way. `Item_Kind` says what every item is, and each row has the widget of that kind: `text` an outlined text field, `number` a spin box (bounded by `Least` and `Most`, stepped by `Step`;
      a whole number stays an `int` when the step is whole, else it is a `float`), `bool` a switch, `enum` a button that shows the item's label and opens a menu of `Choices` (plain values, or `{Value, Label}`) and `colour`
      a swatch that opens the colour picker in a popup (`'#rrggbb'` or `'#rrggbbaa'` text). A row also has Move up, Move down and Remove buttons (the first row cannot move up, the last cannot move down), and the Add
      button under the rows appends an item of the kind: empty text, the least number (or 0), false, the first choice, black. `Min_Items` stops Remove (and says why under the list), `Max_Items` (0 is no limit)
      stops Add; an empty list says "No items".

      Writing. A text row writes when Enter is pressed or the field is left, never per key; a spin box, a switch, a menu and a colour picker write when they change. An edit writes a new list in which only the edited item differs,
      and `On_Change` is called after it. A list the app sets is shown as it is and never rewritten: an item that does not fit the kind (`"x"` among numbers, a choice that is not one, a colour that is not one) is
      shown as the kind's nearest value (0, the first choice, black) and left exactly as it was until the person edits that row. Each item has an identity of its own that stays with it when it is moved, so a row keeps
      what is in it (a field being typed in, an open menu) when other rows move or go, and a list the app sets has new rows. Turning a list into text and back (a TDL list `[a, b, c]`) is not the editor's job.

      The keyboard. Tab goes through each row's field or button, then Move up, Move down and Remove, and on to the next row and the Add button; Enter or Space press a button, the arrows are the spin box's and the menu's,
      Escape closes a menu or a colour popup. A screen reader hears a group named by `Label`, a `list` of `listitem`s named by it and their place (`Shortcuts 2`), each widget with the same name, and buttons that say
      "Move up", "Move down", "Remove" and the Add button's label; the message under the list is an alert. A disabled editor edits nothing. The look is in `ListEditor_Stylesheet.tdl` (the empty note and the message); the
      rows' widgets look as their own do. Not built: dragging a row to move it, Alt+arrow keys to move one (a handler cannot yet choose between three calls by the key), items of mixed kinds, and items that are themselves lists.
    usage_view: |
      Container {
        Name: launcher
        Style { Flex_Direction: vertical, Gap: 16, Width: 520, Height: 420, Padding: 16 }
        Children {
          ListEditor {
            Value: <| words |>
            Label: "Filter words"
            Add_Label: "Add word"
            On_Change: words_changed
          }
          ListEditor {
            Value: <| levels |>
            Item_Kind: enum
            Choices {
              Item { Value: low, Label: Low }
              Item { Value: high, Label: High }
            }
            Max_Items: 4
          }
          ListEditor {
            Value: <| sizes |>
            Item_Kind: number
            Least: 0
            Most: 64
          }
        }
      }
    python: |
      from tess_ui.list_controls import ListModel

      model = ListModel("number", [1, 2, 3], least=0, most=10)
      model.set(1, "50")        # a row sends the new item as text: 2 becomes 10
      model.move(2, -1)         # the item keeps its identity: [1, 3, 10]
      model.values              # [1, 3, 10]
    see: [guide/controls.md, components/spin-boxes.md, components/colour-pickers.md]
  - slug: token-buttons
    title: Token button
    group: Selection and input
    views: [TokenButton]
    widgets: [TokenList]
    md3: |
      Material Design 3 has no control for choosing a design token. An app whose people point a setting at a token of the theme (`$color.primary`, `$space.md`) needs one, and it is built from what MD3 does
      describe: an outlined button that shows the choice, and a searchable list of rows on a menu-like surface.
    built: |
      One view and one control. `TokenButton` is the view you use: a 48 pixel button that shows the token it holds and opens the list of tokens in a layer under it. `TokenList` is the control that draws nothing and is the
      list's mind (`tess_ui.token_controls`: the tokens as rows, the search and the cursor, which the view reaches through the names it binds to it).

      The tokens are data you give it, not read from anywhere. `Tokens` is a list of `{Name, ref, Kind, Value, doc}`: `Name` is what a person looks for (`color.primary`), `ref` is the text a pick writes
      (`$color.primary`; a `$` and the name when it is left out), `Kind` says what the value is, `Value` is the token's value and `doc` one line about it. `Groups` is more tokens in named sets,
      `[{Name, Tokens}]`, which come after `Tokens`; each row then says its group before its doc. `Preferred` is a list of names or refs to list first, in that order. A token with no name, or with the ref of
      an earlier one, is left out. Nothing here knows what a token is: a colour kind is `colour` or `color`, and any other kind is shown as text.

      A row is the token's name, a line under it with its group and doc, and its value: a swatch of the colour for a colour token whose value is `'#rrggbb'` or `'#rrggbbaa'` text, the value as text for any other
      (a colour token whose value is not such text shows the text). The button shows the ref in `Value` with a swatch when the token is a colour it knows; a ref that is none of the tokens is shown as it is and
      is kept. `Value` is two-way text: a pick writes the token's `ref`, calls `On_Pick` and closes the layer unless `Close_On_Pick` is false. The search keeps the tokens that have every word typed in their name,
      ref, group or doc, in any order and without regard to case; a name that starts with the first word comes first, and the preferred ones stay first among equals. The search is empty each time the list opens, and
      the list opens scrolled so that the held token shows, with the cursor on it. The list is a `VirtualList` of `Rows` rows (7 by default) and builds only the rows in view and three past each edge, however
      many tokens there are.

      The keyboard. Enter on the button, or Down, opens the layer with the search field focused. Up, Down, Page Up and Page Down in the field move the cursor and Enter picks the token under it (Left, Right, Home,
      End and Space are the text's). Tab goes on to the list, where Up and Down move by a row, Page Up and Page Down by `Rows`, Home and End go to the ends, and Enter and Space pick. A press picks too. Escape and a
      press outside close the layer (writing false to `Open`), and the focus goes back to the button. A screen reader hears a button named "label: ref" that is `Expanded` while the layer is open, a group, the
      search field, a `list` of `listitem`s each named "name: value" and `Selected` when it is the token held, and an alert for a search that finds nothing.

      The look is in `TokenButton_Stylesheet.tdl`: write one in your project to change the button, the layer and the rows. Not built: a tree of the tokens by their dotted names, tokens that are aliases of
      others (an alias is a token whose value is another ref, shown as text), a preview for kinds other than colour (a spacing bar, a font sample), and reading the tokens from the theme or from the Shell's
      schema (the app passes them).
    usage_view: |
      Container {
        Name: accent
        Style { Flex_Direction: vertical, Gap: 16, Width: 480, Height: 640, Padding: 16 }
        Children {
          TokenButton {
            Label: Accent
            Tokens: <| tokens |>
            Preferred: ["$color.primary"]
            Value: <| accent |>
            On_Pick: accent_picked
          }
          TokenButton {
            Label: Gap
            Tokens: <| tokens |>
            Value: <| gap |>
            Open: <| choosing |>
          }
        }
      }
    python: |
      from tess_ui.token_controls import TokenList

      tokens = [
          {"name": "color.primary", "ref": "$color.primary", "kind": "colour", "value": "#6750a4", "doc": "The brand colour"},
          {"name": "space.md", "ref": "$space.md", "kind": "dimension", "value": 16, "doc": "A medium gap"},
      ]
      found = TokenList(tokens, preferred=["space.md"])
      found.set_query("brand")                  # name, ref, group or doc, every word, any case
      [row["ref"] for row in found.results]     # ['$color.primary']
    see: [guide/controls.md, components/colour-pickers.md, components/font-lists.md]

  - slug: segmented-buttons
    title: Segmented buttons
    group: Selection and input
    views: [SegmentedButton]
    md3: |
      A segmented button is a row of two to five connected options, for one choice or several.
    built: |
      `SegmentedButton` is a view Tesserae ships (`SegmentedButton_View.tdl`): one outlined pill (40 pixels tall, a 1 pixel `outline`, fully
      rounded) of segments with a line between them.

      Each segment is `{Value, Label}` and optionally `{Icon, Disabled}`; `Options` can be an expression, and follows its Signals. `Selected` is the chosen value (with `multiple`, the
      list of chosen values) and a press writes it back. A chosen segment is `secondary_container` with a check that takes the place of its icon, and a segment of its own `Disabled`,
      or all of them with the button's `Disabled`, is dimmed and cannot be pressed. Single choice is a radio group: one Tab stop (the chosen segment), and the arrow keys
      move the choice, skipping a disabled segment; multiple choice is a group of toggles, each its own Tab stop with the arrows moving focus only. The look is in the view, because each segment's state is its own: write a `SegmentedButton_View.tdl` in your project to change it.
    usage_view: |
      Container {
        Name: calendar
        Style { Flex_Direction: vertical, Gap: 16, Width: 360, Height: 140, Padding: 16 }
        Children {
          SegmentedButton {
            Selected: <| range |>
            Options {
              Item { Value: day, Label: Day }
              Item { Value: week, Label: Week, Icon: home }
              Item { Value: month, Label: Month }
            }
          }
          SegmentedButton {
            Multiple: true
            Selected: <| styles |>
            Options {
              Item { Value: bold, Label: Bold }
              Item { Value: italic, Label: Italic }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import segmented_button

      view = segmented_button(app.window, ["Day", "Week", "Month"], selected=0)
      many = segmented_button(app.window, ["Bold", "Italic"], multi=True, selected=[0])

  - slug: time-input
    title: Time input
    group: Selection and input
    views: [TimeInput]
    md3: |
      A time input field is a numeric field for the hour or the minute, used in the time picker's keyboard mode.
    built: |
      `TimeInput` is a view Tesserae ships (`TimeInput_View.tdl`): two outlined `TextField`s, 96 pixels wide, for the hour and the minute, a colon between them and, in
      12-hour time, a `PeriodSelector`. `Hour` (0 to 23) and `Minute` are two-way. The fields take two digits (`Mask: "##"`); a number that does not fit (1 to 12 in 12-hour
      time, 0 to 23 otherwise, and 0 to 59 for the minute) is left out until it does. The fields are filled from the time when the input appears and follow what is typed after
      that. The time picker shows it in its keyboard mode.

      In Python, `time_input_field` is one numeric field of Material 3's: 96 by 72 pixels, a centred two-digit numeral, `unit` `hour` or `minute`. Its `Value` is a `Signal`;
      typing a number in range sets it, and the up and down arrows (and a screen reader's increment and decrement) step it, wrapping.
    usage_view: |
      Container {
        Name: alarm_time
        Style { Width: 360, Height: 120, Padding: 16 }
        Children {
          TimeInput {
            Hour: <| alarm_hour |>
            Minute: <| alarm_minute |>
            Twelve: false
          }
        }
      }
    python: |
      from tess_ui.widgets import time_input_field

      hour = time_input_field(app.window, 9, unit="hour")

  # -- Content -----------------------------------------------------------------------------------
  - slug: text
    title: Text
    group: Content
    widgets: [Text]
    md3: |
      Text is set in Material Design 3's type scale: 15 styles in five groups (display, headline, title, body and
      label), each large, medium or small, with a font, size, weight, line height and tracking.
    built: |
      `Text`. Name a `Typography_Role` (or a `Font_Family`) and Tesserae fills in the rest; a theme's `Typography` can change
      what a role means. A `Text` needs one of them and a `Style.Foreground`: without either the view does not build, and the error says which.

      `Text` can be an expression, and follows the Signals it reads. `Font_Family`, `Font_Size` and `Font_Weight` replace what the role gives. `Wrap` is `word` or `none`,
      `Runs` gives pieces of one text their own style and links ([Rich Text & Links](../guide/rich-text.md)). `Overflow` is `clip` or `ellipsis`, `Text_Align` is `start`, `center` or `end`, and `Max_Lines` cuts a longer text to that many lines (with `Overflow: ellipsis` the last
      one ends in an ellipsis). `Letter_Spacing` adds space between letters, in pixels. `Selectable: true` lets the text be selected and copied, and `Heading: 1` to `6` makes it a heading of that level for a screen reader.

      The colour is `Style.Foreground` (required). Tracking: the roles are drawn with none, as the engine draws them; Material 3's per-role values are
      `tokens.MD3_TRACKING`, and a theme turns them on with `Typography: tokens.MD3_TRACKING_TYPOGRAPHY` (or one role at a time:
      `Typography { Body_Large { Tracking: 0.5 } }`). A node's own `Letter_Spacing` wins.
    usage_view: |
      Container {
        Name: article
        Style { Flex_Direction: vertical, Gap: 8, Width: 360, Height: 200 }
        Children {
          Text {
            Text: Notes
            Typography_Role: headline_medium
            Heading: 1
            Style { Foreground: on_surface }
          }
          Text {
            Text: <| summary |>
            Typography_Role: body_large
            Max_Lines: 3
            Overflow: ellipsis
            Selectable: true
            Style { Foreground: on_surface_variant }
          }
        }
      }
    python: |
      from tess_ui.widgets import text

      heading = text(app.window, "Notes", typography_role="headline_medium")
    see: [themes/index.md]

  - slug: images
    title: Images
    group: Content
    widgets: [Image]
    md3: |
      An image shows a picture, fitted to its box. Material Design 3 describes how to crop and round it in a
      container: a corner from the shape scale, a circle for an avatar.
    built: |
      `Image` is the engine's picture node: Tesserae reads and decodes the file (PNG, JPEG, GIF or WebP, turned upright by its EXIF orientation), and `Fit` says how it fills the box (`cover` by default, or `contain` or `fill`).
      `Src` is relative to the view, and can be an expression, so it follows a Signal. `Alt` says what the picture shows, for a screen reader; without it the picture is decorative
      and hidden from one, unless it handles clicks. The path must be relative and stay inside the view's directory; an absolute one, or one that leaves it, is refused.

      Its shape is `Style.Corner_Radius`: a number, a shape token, `full` for a circle on a square picture, or a different radius on each
      corner (`{top_left: 24}`). The engine clips the picture to it: `full` on a square picture is a circle (an avatar), and on any other a pill. Put it in a rule
      (`Classes: [avatar]`) and every picture with the class takes the shape. Not built: a picture clipped to any other shape (the engine can mask a node with a circle, a rounded rectangle or a path, but no style passes one on).
      A missing or unreadable file stops the view opening, with the widget's name and the file in the message.
    usage_view: |
      Container {
        Name: profile
        Style { Flex_Direction: vertical, Gap: 16, Width: 240, Height: 320 }
        Children {
          Image {
            Src: cat.png
            Alt: "A grey cat asleep on a windowsill"
            Fit: cover
            Style { Width: 240, Height: 160, Corner_Radius: medium }
          }
          Image {
            Src: avatar.png
            Alt: "Your photo"
            Style { Width: 64, Height: 64, Corner_Radius: full }
          }
        }
      }
    python: |
      from tess_ui.widgets import image

      photo = image(app.window, "cat.png", 200, 150, fit="cover")

  - slug: svg
    title: SVG
    group: Content
    widgets: [Svg]
    md3: |
      Material Design 3 uses SVG for its icons and illustrations. An SVG document is vector art: shapes, gradients,
      patterns, clips, masks and text, which scale to any size without blurring.
    built: |
      `Svg`: the engine parses and draws the whole document as one scene, scaled to fit the node's box and
      centred in it. Tesserae reads the file, and decodes the raster pictures in it (`<image href="...">`: PNG, JPEG, GIF
      or WebP, found next to the SVG file, or a `data:` URL) for the engine, which decodes no image format. `Style.Foreground` is what
      `currentColor` means in the document, so a monochrome icon follows the theme, light and dark. Give a `Width` or a
      `Height`, or both.

      Give one of `Src`, a `.svg` or `.svgz` file next to the view (an expression, so it follows a Signal), and `Content`, the document itself as text. `Alt` says what the picture
      shows, for a screen reader; without it the picture is decorative and hidden from one, unless it handles clicks. A missing file, or a document that is not SVG, stops the view
      opening with the widget's name in the message.
    usage_view: |
      Container {
        Name: brand
        Style { Flex_Direction: vertical, Gap: 16, Width: 240, Height: 160 }
        Children {
          Svg {
            Src: logo.svg
            Alt: "The Tesserae logo"
            Style { Width: 96, Height: 96, Foreground: primary }
          }
          Svg {
            Content: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"currentColor\"/></svg>"
            Style { Width: 24, Height: 24, Foreground: on_surface }
          }
        }
      }
    python: |
      from tess_ui.widgets import svg

      logo = svg(app.window, '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>',
                 width=48, height=48, color="primary", label="A dot")

  - slug: video
    title: Video
    group: Content
    views: [VideoPlayer]
    md3: |
      Video is content, not a component, in Material Design 3; Tesserae shows frames you supply.
    built: |
      An `Image` takes a `Frame`, `(rgba bytes, width, height)`, from a binding and shows each new one; it keeps the last when the binding gives nothing. There is no decoder: the app decodes and pushes.

      `VideoPlayer` is a view Tesserae ships (`VideoPlayer_View.tdl`) that puts transport controls under such a picture: a play/pause button, the time, a seek slider, the length and a mute button.

      The app pushes each `Frame` as the video plays; `Width` and `Height` are the picture's size (the controls are as wide) and `Fit` how it fills its box (`contain` here). The three
      two-way values are `Playing` (the play button flips it; the app's player follows), `Position` (seconds; the seek slider shows and writes it, and the app moves it on as it plays)
      and `Muted` (the volume button flips it). `Duration` is the length in seconds, and the slider is off without one. `Buffering` lays a wait ring over the picture, `Caption` puts a
      subtitle on a darkened band at its foot, `Step` is how far the arrow keys move the slider, and `Label` is the player's name for a screen reader.

      On the seek slider: Space plays or pauses, the arrows step the position, M mutes. Not built: a decoder (decode with the library you choose, and set `Frame`), full-screen, speeds, a volume level, a poster.
    usage_view: |
      Container {
        Name: movie
        Style { Width: 520, Height: 320, Padding: 16 }
        Children {
          VideoPlayer {
            Frame: <| frame |>
            Playing: <| playing |>
            Position: <| position |>
            Duration: 125
            Muted: <| muted |>
            Caption: <| words |>
          }
        }
      }
    python: |
      from tess_ui.widgets import video

      clip = video(app.window, 320, 180, fit="contain")

  - slug: carousel
    title: Carousel
    group: Content
    views: [Carousel]
    md3: |
      A carousel shows a row of items that scroll, with the focused one largest. MD3 has multi-browse, uncontained,
      hero and full-screen layouts.
    built: |
      `Carousel` is a view Tesserae ships (`Carousel_View.tdl`): a `ScrollView` that scrolls sideways (`Orientation: horizontal`) and settles on an item
      (`Snap`, with each item's `Snap_Align`), of items with 28 pixel corners, 8 pixels apart, with a title on a darkened band.

      Each of `Items` is `{Value, Title}` and optionally `{image, Supporting}`. `Variant` sets how big the items are: `uncontained` (the default; every item `Item_Width` wide),
      `multi_browse` (a large item, a medium one, then small ones), `hero` (large items with a peek of the next) or `center_hero` (the middle item large, with a peek of each
      neighbour). `Width` and `Height` are the carousel's own size (360 by 200 by default). Pressing an item sets `Chosen` (two-way) to its `Value`.

      The wheel and a drag scroll it; when it stops it settles with an item at the start (the middle for `center_hero`). The items are focusable and the arrow keys move along
      them. A `ScrollView` takes `Snap` (`none`, `start`, `center`, `end`) and any node a `Snap_Align` style, so other strips can do the same. Not built: the sizes changing as
      it scrolls (a multi-browse carousel's large item is the first one), parallax on the pictures, dot indicators, full-screen, autoplay.
    usage_view: |
      Container {
        Name: gallery
        Style { Width: 420, Height: 260 }
        Children {
          Carousel {
            Variant: hero
            Chosen: <| opened |>
            Items {
              Item { Value: a, Title: Paris, Supporting: "Three days" }
              Item { Value: b, Title: Rome }
              Item { Value: c, Title: Lisbon }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import carousel

      gallery = carousel(app.window, 480, 180, layout="multi_browse", items=[])

  - slug: pagination
    title: Pagination
    group: Content
    views: [Pagination]
    md3: |
      Pagination shows where the user is among pages: a row of dots or numbers.
    built: |
      `Pagination` is a view Tesserae ships (`Pagination_View.tdl`): previous and next arrows with the page numbers between them.

      `Page` (from 1) is two-way: choosing another writes it back. `Pages` is how many there are. `Compact` shows "3 of 12" between the arrows instead of the numbers, and `Dots`
      shows a dot for each page, the current one `primary`, for a carousel (best under ten pages).

      The first and last pages and the ones beside the current page always show, with an ellipsis for the stretch left out (up to seven pages show whole). The
      current page is a filled button, and each number is named "Page n" and marks the current one as the page. Previous is disabled on the first page and next on the
      last. Tab visits each control, and Enter or Space chooses. Not built: an items-per-page control, a count of all the items, and a jump-to field.
    usage_view: |
      Container {
        Name: results
        Style { Flex_Direction: vertical, Gap: 12, Width: 480, Height: 200 }
        Children {
          Pagination {
            Page: <| page |>
            Pages: <| total_pages |>
          }
          Pagination {
            Page: <| page |>
            Pages: <| total_pages |>
            Compact: true
          }
          Pagination {
            Page: <| page |>
            Pages: 5
            Dots: true
          }
        }
      }
    python: |
      from tess_ui.widgets import pagination

      pages = pagination(app.window, 10, current=0)

  # -- Beyond MD3 --------------------------------------------------------------------------------
  - slug: status-bar
    title: Status bar
    group: Beyond MD3
    views: [StatusBar]
    md3: |
      Material Design 3 has no status bar. A desktop app often wants one, so this is a thin strip in MD3's
      surface and *label* style.
    built: |
      `StatusBar` is a view Tesserae ships (`StatusBar_View.tdl`): a 24 pixel `surface_container` strip as wide as the place it is put in, with
      `label_small` text in `on_surface_variant`.

      Each of `Items` is `{Text}` and optionally `{Icon, Side, Value, Tooltip}`; `Side` is `start` (the default), `center` or `end`. `Text` (a string) is a shorthand for one message
      at the start, and `Width` sets the bar's width instead of the place it is put in. `Progress` (0 to 1) shows a 4 pixel determinate indicator along the top edge, and `Busy`
      one with no end. `Clicked` is two-way: the `Value` of the item last pressed.

      An item with a `Value` is a button: it has a state layer, a tooltip if it has one, and pressing it sets `Clicked`. The centre section is centred on the
      bar whatever the sides hold. The bar is announced politely when its items change. Not built: items that can be dragged or hidden when the window is
      narrow.
    usage_view: |
      Container {
        Name: editor
        Style { Flex_Direction: vertical, Width: 640, Height: 200 }
        Children {
          StatusBar {
            Clicked: <| item |>
            Busy: <| saving |>
            Items {
              Item { Text: Ready }
              Item { Text: Saved, Side: center }
              Item { Text: "Ln 4, Col 2", Side: end, Value: goto, Tooltip: "Go to line" }
              Item { Text: UTF-8, Side: end, Icon: home, Value: encoding }
            }
          }
        }
      }
    python: |
      from tess_ui.widgets import status_bar

      status = status_bar(app.window, "Ready", style={"height": 32})
    see: [guide/windows-and-docks.md]

  - slug: node-graph
    title: Node graph
    group: Beyond MD3
    widgets: [NodeGraph, GraphNode]
    md3: |
      Material Design 3 has no node graph. This is a pannable canvas of titled boxes joined by edges, for tools.
    built: |
      The `NodeGraph` kind (`NodeGraph` in a view), with `GraphNode` children at an `X` and a `Y`. Drag the background to pan, the wheel zooms about the pointer, drag a node (or
      press the arrow keys on a focused one) to move it, and its edges follow.

      `Edges` are the links, each `{from: id, to: id}`, the ids of the `GraphNode`s: their path from the view's root, as `root.graph.load` for the node `load` in the graph `graph`; an edge runs from the right side of one node to the left of the other, as a curve. `Snap`
      makes a node the user moves land on a multiple of that many pixels (an arrow key steps one square, or 8 pixels with no grid; `0` is no grid), `Arrows` ends each edge in an arrowhead, and `Fit`
      pans and zooms when it opens so every node shows (never past actual size). A `GraphNode` has a `Label` (its title), an `X` and a `Y` in the graph's own coordinates, and its
      size from `Style`; what it holds goes in its body.

      Pressing a node chooses it (a `primary` border, and it is selected to a screen reader); pressing the background chooses none. From Python the widget has `fit_to_view(padding)`,
      `zoom`, `Offset`, `Snap`, `Arrows` and `Selected` (a `Signal` of the node chosen). Not built: ports and dragging to connect, labels on edges, selecting several, a minimap, undo, and
      building only the nodes in view.
    usage_view: |
      Container {
        Name: pipeline
        Style { Width: 640, Height: 360 }
        Children {
          NodeGraph {
            Name: graph
            Arrows: true
            Fit: true
            Snap: 20
            Edges {
              Item { From: root.graph.load, To: root.graph.clean }
              Item { From: root.graph.clean, To: root.graph.save }
            }
            Style { Width: 640, Height: 360 }
            Children {
              GraphNode {
                Name: load
                Label: Load
                X: 20
                Y: 40
                Style { Width: 140, Height: 80 }
              }
              GraphNode {
                Name: clean
                Label: Clean
                X: 240
                Y: 100
                Style { Width: 140, Height: 80 }
              }
              GraphNode {
                Name: save
                Label: Save
                X: 460
