tesserae: 0.6
# The configuration application's window: a toolbar, three areas side by side (Files, Structure, Text) and a status line. The ViewModel (viewmodel.py) holds every value
# and action; this file only says where they show. Tab moves through the toolbar, the Files tree, the Structure tree and the text; each tree takes the arrow keys.
name: main
widget: Container
style: {flex_direction: vertical, width: 100%, height: 100%, background: surface}
a11y: {role: group, label: Tesserae Shell configuration}
handlers: {on_key: "key_pressed(event.key, event.ctrl, event.shift, event.alt)"}
children:
  - widget: Container
    name: toolbar
    a11y: {role: group, label: Actions}
    style: {flex_direction: horizontal, align_content: left, gap: 8, padding: 8, width: 100%}
    children:
      - {widget: Button, name: save_button, label: Save, variant: filled, disabled: "{{ not dirty }}", handlers: {on_click: save}}
      - {widget: Button, name: undo_button, label: Undo, variant: tonal, disabled: "{{ not can_undo }}", handlers: {on_click: undo}}
      - {widget: Button, name: redo_button, label: Redo, variant: tonal, disabled: "{{ not can_redo }}", handlers: {on_click: redo}}
      - {widget: Button, name: format_button, label: Format file, variant: outlined, disabled: "{{ not has_tree }}", handlers: {on_click: format_file}}
      - {widget: Button, name: check_button, label: Check, variant: outlined, disabled: "{{ checking }}", handlers: {on_click: check_run}}
      - {widget: Button, name: reload_button, label: Reload shell, variant: outlined, disabled: "{{ not shell_running }}", handlers: {on_click: shell_reload}}
      - {widget: Switch, name: apply_switch, label: Apply as I edit, selected: "{{ apply_on_edit }}", a11y: {label: "Apply as I edit: write each change to the file and reload the running shell"}, handlers: {on_change: "apply_changed(apply_on_edit)"}}
      - {widget: Text, name: title, text: "{{ title }}", typography_role: title_small, max_lines: 1, overflow: ellipsis, style: {flex: expand_horizontal, min_width: 0}}
  - widget: Container
    name: panes
    style: {flex_direction: horizontal, gap: 8, padding: {left: 8, right: 8, top: 0, bottom: 0}, width: 100%, flex: expand_vertical, min_height: 0}
    children:
      - widget: Container
        name: files_pane
        a11y: {role: group, label: Files}
        style: {flex_direction: vertical, width: 200, gap: 4, background: surface_container_low, corner_radius: 12, padding: 8}
        children:
          - {widget: Text, name: files_heading, text: Files, typography_role: title_small}
          - {widget: Text, name: folder_text, text: "{{ folder }}", typography_role: body_small, max_lines: 1, overflow: ellipsis, style: {foreground: on_surface_variant}}
          - widget: ScrollView
            name: files_scroll
            style: {flex: expand_vertical, width: 100%, min_height: 0}
            children:
              - {widget: Tree, name: files_tree, nodes: "{{ file_nodes }}", expanded: "{{ file_expanded }}", selected: "{{ file_selected }}", compact: true}
      - widget: Container
        name: structure_pane
        a11y: {role: group, label: Structure}
        style: {flex_direction: vertical, width: 270, gap: 4, background: surface_container_low, corner_radius: 12, padding: 8}
        children:
          - {widget: Text, name: structure_heading, text: Structure, typography_role: title_small}
          - {widget: Text, name: selection_text, text: "{{ selected_label }}", typography_role: body_small, max_lines: 1, overflow: ellipsis, style: {foreground: on_surface_variant}}
          - widget: Container
            name: structure_actions
            a11y: {role: group, label: Structure actions}
            style: {flex_direction: horizontal, align_content: left, gap: 0, width: 100%}
            children:
              - {widget: IconButton, name: add_button, icon: add, size: xs, label: "Add a child block (Ctrl+Shift+N)", disabled: "{{ not can_add }}", handlers: {on_click: structure_add}}
              - {widget: IconButton, name: remove_button, icon: delete, size: xs, label: "Remove the block (Delete)", disabled: "{{ not can_remove }}", handlers: {on_click: structure_remove}}
              - {widget: IconButton, name: up_button, icon: arrow_up, size: xs, label: "Move the block up (Alt+Up)", disabled: "{{ not can_move_up }}", handlers: {on_click: structure_move_up}}
              - {widget: IconButton, name: down_button, icon: arrow_down, size: xs, label: "Move the block down (Alt+Down)", disabled: "{{ not can_move_down }}", handlers: {on_click: structure_move_down}}
              - {widget: IconButton, name: move_button, icon: folder, size: xs, label: "Move the block into another block (Ctrl+Shift+M)", disabled: "{{ not can_move_to }}", handlers: {on_click: structure_move_to}}
              - {widget: IconButton, name: duplicate_button, icon: content_copy, size: xs, label: "Duplicate the block (Ctrl+Shift+D)", disabled: "{{ not can_duplicate }}", handlers: {on_click: structure_duplicate}}
              - {widget: IconButton, name: menu_button, icon: dots_vertical, size: xs, label: "Structure menu (Menu key)", disabled: "{{ not has_tree }}", handlers: {on_click: structure_menu}}
          - widget: Text
            name: structure_off
            if: "has_file and not has_tree"
            text: "The structure is off: this file has syntax errors. It follows when the text parses."
            typography_role: body_medium
            style: {width: 100%}
          - widget: ScrollView
            name: structure_scroll
            if: has_tree
            style: {flex: expand_vertical, width: 100%, min_height: 0}
            children:
              - {widget: Tree, name: structure_tree, nodes: "{{ structure_nodes }}", expanded: "{{ structure_expanded }}", selected: "{{ structure_selected }}", compact: true}
      - widget: Container
        name: form_pane
        a11y: {role: group, label: Form}
        style: {flex_direction: vertical, width: 440, gap: 4, background: surface_container_low, corner_radius: 12, padding: 8}
        children:
          - {widget: Text, name: form_heading, text: Form, typography_role: title_small}
          - {widget: Text, name: form_title, text: "{{ form_title }}", typography_role: body_small, max_lines: 1, overflow: ellipsis, style: {foreground: on_surface_variant}}
          - widget: Text
            for: note in form_notes
            key: note
            name: form_note
            text: "{{ note }}"
            typography_role: body_small
            style: {width: 100%, foreground: on_surface_variant}
          - widget: ScrollView
            name: form_scroll
            style: {flex: expand_vertical, width: 100%, min_height: 0}
            children:
              - widget: Container
                name: form_list
                style: {flex_direction: vertical, width: 100%, gap: 2}
                children:
                  - widget: Container
                    for: item in form_items
                    key: item['key']
                    name: form_item
                    state: {active: false}
                    style: {flex_direction: vertical, width: 100%, gap: 2}
                    children:
                      - widget: Container
                        name: group_header
                        if: "item['type'] == 'group'"
                        interaction: true
                        a11y: {role: button, label: "{{ item['label'] }}", expanded: "{{ item['open'] }}", description: "{{ item['present'] }} of {{ item['count'] }} keys set"}
                        handlers: {on_click: "form_group(item['label'])"}
                        style: {flex_direction: horizontal, align_content: left, gap: 4, width: 100%, padding: {left: 0, right: 0, top: 4, bottom: 4}}
                        children:
                          - {widget: Icon, name: chevron, icon: "{{ 'chevron_down' if item['open'] else 'chevron_right' }}", style: {width: 20, height: 20, foreground: primary}}
                          - {widget: Text, name: group_label, text: "{{ item['label'] }}", typography_role: label_large, style: {foreground: primary}}
                          - {widget: Text, name: group_count, text: "{{ item['present'] }} of {{ item['count'] }} set", typography_role: label_small, style: {foreground: on_surface_variant}}
                      - widget: Container
                        name: row
                        if: "item['type'] == 'row'"
                        tooltip: "{{ item['doc'] }}"
                        style: {flex_direction: horizontal, align_content: left, gap: 8, width: 100%}
                        children:
                          - widget: Container
                            name: label_box
                            style: {flex_direction: vertical, width: 120, gap: 0}
                            children:
                              - {widget: Text, name: label, text: "{{ item['label'] }}", typography_role: body_medium, max_lines: 2, style: {width: 100%}}
                              - {widget: Text, name: required, if: "item['missing']", text: "required", typography_role: label_small, style: {foreground: error}}
                              - widget: Text
                                name: marker_text
                                for: "marker in item['markers']"
                                key: marker
                                text: "{{ marker }}"
                                typography_role: label_small
                                style: {foreground: on_surface_variant}
                          - widget: Container
                            name: cells
                            style: {flex_direction: vertical, flex: expand_horizontal, min_width: 0, gap: 2}
                            children:
                              - widget: Container
                                for: cell in item['cells']
                                key: cell['id']
                                name: cell
                                state:
                                  draft: "{{ cell.get('field', '') }}"
                                  unit: "{{ cell.get('unit', '') }}"
                                  on: "{{ cell.get('checked', False) }}"
                                  colour: "{{ cell.get('colour', '#808080') }}"
                                  linked: "{{ cell.get('linked', True) }}"
                                  d0: "{{ (cell.get('fields', []) + ['', '', '', ''])[0] }}"
                                  d1: "{{ (cell.get('fields', []) + ['', '', '', ''])[1] }}"
                                  d2: "{{ (cell.get('fields', []) + ['', '', '', ''])[2] }}"
                                  d3: "{{ (cell.get('fields', []) + ['', '', '', ''])[3] }}"
                                  items: "{{ cell.get('items', []) }}"
                                  token: "{{ cell['token_ref'] }}"
                                  lastkey: ""
                                style: {flex_direction: horizontal, align_content: left, gap: 4, width: 100%}
                                children:
                                  - {widget: Text, name: column, if: "item['many']", text: "{{ cell['column'] }}", typography_role: label_small, style: {width: 56, foreground: on_surface_variant}}
                                  - widget: Switch
                                    name: switch
                                    if: "cell['ui'] == 'switch'"
                                    selected: "{{ on }}"
                                    a11y: {label: "{{ item['label'] }}"}
                                    handlers: {on_change: "form_commit(cell['id'], {'checked': on})", on_focus_enter: "active = True", on_focus_exit: "active = False"}
                                  - widget: Button
                                    name: choose
                                    if: "cell['ui'] == 'choice'"
                                    label: "{{ cell['shown'] }}"
                                    variant: "{{ 'tonal' if cell['present'] else 'outlined' }}"
                                    size: xs
                                    a11y: {label: "{{ item['label'] }}", description: "{{ item['doc'] }}"}
                                    handlers: {on_click: "form_choices(cell['id'])", on_focus_enter: "active = True", on_focus_exit: "active = False"}
                                  - widget: Container
                                    name: field_box
                                    if: "cell['ui'] in ('field', 'length')"
                                    style: {flex_direction: horizontal, align_content: left, gap: 4, flex: expand_horizontal, min_width: 0}
                                    children:
                                      - widget: TextInput
                                        name: field
                                        if: "cell['ui'] == 'field' or cell['number_enabled']"
                                        text: "{{ draft }}"
                                        placeholder: "{{ cell['placeholder'] }}"
                                        read_only: "{{ cell['readonly'] }}"
                                        typography_role: body_medium
                                        a11y: {label: "{{ item['label'] }}", description: "{{ item['doc'] }}"}
                                        style: {flex: expand_horizontal, min_width: 48, height: 32, padding: {left: 8, right: 8, top: 4, bottom: 4}}
                                        handlers:
                                          on_submit: "form_commit(cell['id'], {'text': draft, 'unit': unit})"
                                          on_focus_exit: "form_commit(cell['id'], {'text': draft, 'unit': unit}); active = False"
                                          on_focus_enter: "active = True"
                                          on_key: "lastkey = event.key; after(0, \"form_key(cell['id'], lastkey, draft)\", 'step')"
                                      - {widget: Text, name: suffix, if: "cell['suffix'] != ''", text: "{{ cell['suffix'] }}", typography_role: body_small, style: {foreground: on_surface_variant}}
                                      - widget: Button
                                        name: unit_button
                                        if: "cell['ui'] == 'length'"
                                        label: "{{ unit }}"
                                        variant: outlined
                                        size: xs
                                        a11y: {label: "{{ item['label'] }} unit"}
                                        handlers: {on_click: "form_units(cell['id'], draft)", on_focus_enter: "active = True", on_focus_exit: "active = False"}
                                      - widget: Button
                                        name: browse
                                        if: "cell['browse']"
                                        label: Browse
                                        variant: outlined
                                        size: xs
                                        handlers: {on_click: "form_browse(cell['id'])", on_focus_enter: "active = True", on_focus_exit: "active = False"}
                                  - widget: Container
                                    name: sides_box
                                    if: "cell['ui'] == 'sides'"
                                    style: {flex_direction: horizontal, align_content: left, gap: 4, flex: expand_horizontal, min_width: 0}
                                    children:
                                      - widget: TextInput
                                        name: side_0
                                        text: "{{ d0 }}"
                                        placeholder: "{{ cell['placeholder'] }}"
                                        typography_role: body_medium
                                        a11y: {label: "{{ item['label'] }} {{ cell['labels'][0] }}"}
                                        style: {flex: expand_horizontal, min_width: 36, height: 32, padding: {left: 8, right: 8, top: 4, bottom: 4}}
                                        handlers: {on_submit: "form_commit(cell['id'], {'fields': [d0, d1, d2, d3], 'linked': linked})", on_focus_exit: "form_commit(cell['id'], {'fields': [d0, d1, d2, d3], 'linked': linked}); active = False", on_focus_enter: "active = True"}
                                      - widget: TextInput
                                        name: side_1
                                        if: "not linked"
                                        text: "{{ d1 }}"
                                        placeholder: "{{ cell['placeholder'] }}"
                                        typography_role: body_medium
                                        a11y: {label: "{{ item['label'] }} {{ cell['labels'][1] }}"}
                                        style: {flex: expand_horizontal, min_width: 36, height: 32, padding: {left: 8, right: 8, top: 4, bottom: 4}}
                                        handlers: {on_submit: "form_commit(cell['id'], {'fields': [d0, d1, d2, d3], 'linked': linked})", on_focus_exit: "form_commit(cell['id'], {'fields': [d0, d1, d2, d3], 'linked': linked}); active = False", on_focus_enter: "active = True"}
                                      - widget: TextInput
                                        name: side_2
                                        if: "not linked"
                                        text: "{{ d2 }}"
                                        placeholder: "{{ cell['placeholder'] }}"
                                        typography_role: body_medium
                                        a11y: {label: "{{ item['label'] }} {{ cell['labels'][2] }}"}
                                        style: {flex: expand_horizontal, min_width: 36, height: 32, padding: {left: 8, right: 8, top: 4, bottom: 4}}
                                        handlers: {on_submit: "form_commit(cell['id'], {'fields': [d0, d1, d2, d3], 'linked': linked})", on_focus_exit: "form_commit(cell['id'], {'fields': [d0, d1, d2, d3], 'linked': linked}); active = False", on_focus_enter: "active = True"}
                                      - widget: TextInput
                                        name: side_3
                                        if: "not linked"
                                        text: "{{ d3 }}"
                                        placeholder: "{{ cell['placeholder'] }}"
                                        typography_role: body_medium
                                        a11y: {label: "{{ item['label'] }} {{ cell['labels'][3] }}"}
                                        style: {flex: expand_horizontal, min_width: 36, height: 32, padding: {left: 8, right: 8, top: 4, bottom: 4}}
                                        handlers: {on_submit: "form_commit(cell['id'], {'fields': [d0, d1, d2, d3], 'linked': linked})", on_focus_exit: "form_commit(cell['id'], {'fields': [d0, d1, d2, d3], 'linked': linked}); active = False", on_focus_enter: "active = True"}
                                      - widget: Button
                                        name: link_button
                                        if: "cell['can_link']"
                                        label: "{{ 'Linked' if linked else 'Separate' }}"
                                        variant: text
                                        size: xs
                                        a11y: {label: "{{ item['label'] }}: one value for all sides, or one for each"}
                                        handlers: {on_click: "d1 = d0; d2 = d0; d3 = d0; linked = not linked"}
                                  - widget: ColourPicker
                                    name: colour_picker
                                    if: "cell['ui'] == 'colour'"
                                    popup: true
                                    value: "{{ colour }}"
                                    label: "{{ item['label'] }}"
                                    handlers: {on_change: "after(300, \"form_colour(cell['id'], colour)\", 'colour')"}
                                  - {widget: Text, name: colour_text, if: "cell['ui'] == 'colour'", text: "{{ cell['text'] if cell['present'] else cell['placeholder'] }}", typography_role: body_small, style: {flex: expand_horizontal, min_width: 0, foreground: on_surface_variant}}
                                  - widget: IconPicker
                                    name: icon_picker
                                    if: "cell['ui'] == 'icon'"
                                    popup: true
                                    value: "{{ draft }}"
                                    icons_folder: "{{ cell['icons_folder'] }}"
                                    label: "{{ item['label'] }}"
                                    placeholder: "{{ cell['placeholder'] if cell['placeholder'] != '' else 'Choose an icon' }}"
                                    on_change: "form_commit(cell['id'], {'text': draft})"
                                  - widget: FontList
                                    name: font_list
                                    if: "cell['ui'] == 'font'"
                                    popup: true
                                    value: "{{ draft }}"
                                    label: "{{ item['label'] }}"
                                    on_change: "form_commit(cell['id'], {'text': draft})"
                                  - widget: KeyChordField
                                    name: chord_field
                                    if: "cell['ui'] == 'chord'"
                                    value: "{{ draft }}"
                                    label: "{{ item['label'] }}"
                                    on_change: "form_commit(cell['id'], {'text': draft})"
                                  - widget: ListEditor
                                    name: list_editor
                                    if: "cell['ui'] == 'list'"
                                    value: "{{ items }}"
                                    item_kind: "{{ cell['item_kind'] }}"
                                    choices: "{{ cell['choices'] }}"
                                    least: "{{ cell['least'] }}"
                                    most: "{{ cell['most'] }}"
                                    step: "{{ cell['step'] }}"
                                    min_items: "{{ cell['min_items'] }}"
                                    max_items: "{{ cell['max_items'] }}"
                                    label: "{{ item['label'] }}"
                                    on_change: "form_commit(cell['id'], {'items': items})"
                                  - widget: TokenButton
                                    name: token_button
                                    if: "cell['tokens']"
                                    value: "{{ token }}"
                                    groups: "{{ cell['token_groups'] }}"
                                    preferred: "{{ cell['token_preferred'] }}"
                                    label: "Theme token for {{ item['label'] }}"
                                    placeholder: "$ token"
                                    width: 360
                                    on_pick: "form_token(cell['id'], token)"
                                  - widget: Button
                                    name: expression_button
                                    if: "cell['slot']"
                                    label: "{ }"
                                    variant: "{{ 'tonal' if cell['expression'] else 'text' }}"
                                    size: xs
                                    a11y: {label: "Expression for {{ item['label'] }}", pressed: "{{ cell['expression'] }}"}
                                    handlers: {on_click: "form_expression(cell['id'])", on_focus_enter: "active = True", on_focus_exit: "active = False"}
                                  - widget: IconButton
                                    name: reset_button
                                    icon: undo
                                    size: xs
                                    label: "Reset {{ item['label'] }} to its default"
                                    disabled: "{{ not cell['present'] }}"
                                    handlers: {on_click: "form_reset(cell['id'])", on_focus_enter: "active = True", on_focus_exit: "active = False"}
                      - {widget: Text, name: row_error, if: "item['type'] == 'row' and item['error'] != ''", text: "{{ item['error'] }}", typography_role: body_small, a11y: {live: polite}, style: {width: 100%, foreground: error}}
                      - {widget: Text, name: doc_line, if: "item['type'] == 'row' and active and item['doc'] != ''", text: "{{ item['doc'] }}", typography_role: body_small, style: {width: 100%, foreground: on_surface_variant}}
      - widget: Container
        name: text_pane
        a11y: {role: group, label: Text}
        style: {flex_direction: vertical, gap: 4, background: surface_container_low, corner_radius: 12, padding: 8, flex: expand_horizontal, min_width: 0}
        children:
          - {widget: Text, name: text_heading, text: Text, typography_role: title_small}
          - widget: TextInput
            name: editor
            text: "{{ text }}"
            multiline: true
            read_only: "{{ read_only or not has_file }}"
            typography_role: body_medium
            handlers: {on_change: text_edited}
            a11y: {label: "TDL text of the open file"}
            style: {flex: expand_vertical, width: 100%, min_height: 120}
          - widget: Container
            name: errors
            if: "len(error_rows) > 0"
            a11y: {role: group, label: Syntax errors}
            style: {flex_direction: vertical, gap: 2, width: 100%, background: error_container, corner_radius: 8, padding: 8}
            children:
              - {widget: Text, name: errors_heading, text: "{{ len(error_rows) }} syntax error(s): the structure is off until the text parses", typography_role: label_large, style: {foreground: on_error_container}}
              - widget: Container
                for: row in error_rows
                key: row['text']
                name: error_row
                style: {flex_direction: horizontal, align_content: left, gap: 8, width: 100%}
                children:
                  - {widget: Icon, name: error_icon, icon: error, style: {width: 18, height: 18, foreground: on_error_container}}
                  - {widget: Text, name: error_text, text: "{{ row['text'] }}", typography_role: body_small, style: {foreground: on_error_container, flex: expand_horizontal, min_width: 0}}
  - widget: Container
    name: disk_banner
    if: has_disk_change
    a11y: {role: group, label: File changed on disk}
    style: {flex_direction: horizontal, align_content: left, gap: 8, padding: 8, width: 100%, background: tertiary_container, corner_radius: 8}
    children:
      - {widget: Icon, name: disk_icon, icon: alert, style: {width: 18, height: 18, foreground: on_tertiary_container}}
      - {widget: Text, name: disk_text, text: "{{ disk_message }}", typography_role: body_small, a11y: {live: assertive}, style: {flex: expand_horizontal, min_width: 0, foreground: on_tertiary_container}}
      - {widget: Button, name: disk_reload_button, label: Reload, variant: filled, size: xs, handlers: {on_click: disk_reload}}
      - {widget: Button, name: disk_keep_button, label: Keep mine, variant: outlined, size: xs, handlers: {on_click: disk_keep}}
  - widget: Container
    name: problems_pane
    a11y: {role: group, label: Problems}
    style: {flex_direction: vertical, gap: 2, padding: {left: 8, right: 8, top: 4, bottom: 4}, width: 100%}
    children:
      - {widget: Text, name: problems_heading, text: "{{ problems_title }}", typography_role: title_small, a11y: {live: polite}}
      - widget: ScrollView
        name: problems_scroll
        if: has_problems
        style: {width: 100%, height: 96}
        children:
          - widget: Container
            name: problems_list
            a11y: {role: list, label: Findings of check}
            style: {flex_direction: vertical, width: 100%, gap: 0}
            children:
              - widget: Container
                for: problem in problems
                key: problem['id']
                name: problem_row
                interaction: true
                a11y: {role: listitem, label: "{{ problem['severity'] }}: {{ problem['where'] }} {{ problem['message'] }}"}
                handlers: {on_click: "problem_pick(problem['index'])"}
                style: {flex_direction: horizontal, align_content: left, gap: 8, width: 100%, padding: {left: 4, right: 4, top: 2, bottom: 2}}
                children:
                  - {widget: Icon, name: problem_icon, icon: "{{ problem['icon'] }}", style: {width: 18, height: 18, foreground: "{{ 'error' if problem['icon'] == 'error' else 'on_surface_variant' }}"}}
                  - {widget: Text, name: problem_severity, text: "{{ problem['severity'] }}", typography_role: label_large, style: {width: 64}}
                  - {widget: Text, name: problem_where, text: "{{ problem['where'] }}", typography_role: label_medium, style: {width: 240, foreground: on_surface_variant}}
                  - {widget: Text, name: problem_message, text: "{{ problem['message'] }}{{ ' (' + problem['hint'] + ')' if problem['hint'] else '' }}", typography_role: body_small, style: {flex: expand_horizontal, min_width: 0}}
  - widget: Container
    name: status_bar
    a11y: {role: group, label: Status}
    style: {flex_direction: horizontal, align_content: left, gap: 8, padding: 8, width: 100%}
    children:
      - {widget: Icon, name: status_icon, if: status_is_error, icon: error, style: {width: 18, height: 18, foreground: error}}
      - {widget: Text, name: status_text, text: "{{ status }}", typography_role: body_small, a11y: {live: polite}, style: {flex: expand_horizontal, min_width: 0, foreground: "{{ 'error' if status_is_error else 'on_surface_variant' }}"}}
      - {widget: Text, name: shell_text, text: "{{ shell_state }}", typography_role: body_small, max_lines: 1, overflow: ellipsis, style: {foreground: on_surface_variant}}
  - widget: Menu
    name: structure_menu
    if: menu_open
    open: "{{ menu_open }}"
    anchor: structure_actions
    items: "{{ menu_items }}"
    chosen: "{{ menu_chosen }}"
    focus_first: true
    width: 260
    on_pick: "structure_command(menu_chosen)"
  - widget: Dialog
    name: picker
    if: picker_open
    open: "{{ picker_open }}"
    headline: "{{ picker_title }}"
    width: 440
    max_height: 400
    actions: [{label: Cancel, value: cancel}]
    children:
      - widget: Container
        name: picker_list
        a11y: {role: list, label: "{{ picker_title }}"}
        style: {flex_direction: vertical, width: 100%}
        children:
          - widget: Container
            for: option in picker_items
            key: option['value']
            name: option
            interaction: true
            a11y: {role: listitem, label: "{{ option['label'] }}", selected: "{{ option['value'] == picker_current }}"}
            handlers: {on_click: "pick_option(option['value'])"}
            style: {flex_direction: horizontal, align_content: left, gap: 8, padding: 8, width: 100%, corner_radius: 8, background: "{{ 'secondary_container' if option['value'] == picker_current else 'transparent' }}"}
            children:
              - {widget: Rect, name: swatch, if: "option['colour'] != ''", style: {width: 20, height: 20, corner_radius: 4, background: "{{ option['colour'] }}", border_width: 1, border_color: outline}}
              - {widget: Text, name: option_label, text: "{{ option['label'] }}", typography_role: body_medium, style: {width: 150}}
              - {widget: Text, name: option_hint, text: "{{ option['hint'] }}", typography_role: body_small, max_lines: 2, style: {flex: expand_horizontal, min_width: 0, foreground: on_surface_variant}}
  - widget: FileDialog
    name: files_dialog
    if: file_open
    open: "{{ file_open }}"
    mode: "{{ file_mode }}"
    start: "{{ file_start }}"
    root: "{{ file_root }}"
    filters: "{{ file_filters }}"
    filename: "{{ file_filename }}"
    multiple: "{{ file_multiple }}"
    headline: "{{ file_headline }}"
    accept_label: "{{ file_accept_label }}"
    show_hidden: "{{ file_show_hidden }}"
    value: "{{ file_value }}"
    on_accept: file_accepted
    on_cancel: file_cancelled
