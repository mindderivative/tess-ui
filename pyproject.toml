[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tesserae-ui"  # on PyPI; `tesserae` there is an unrelated project, which is why the import name is `tess_ui`.
version = "0.6.0.1"
description = "A pyCopper-style declarative Python GUI framework, powered by the Tesserae Render Engine (tess_re)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"  # the user's floor (M76); 3.9 would also need a compiler for materialyoucolor
authors = [{ name = "Phil Hodgins", email = "philip.a.hodgins@gmail.com" }]
keywords = ["gui", "desktop", "declarative", "mvvm", "material-design"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "tesserae-engine==0.6.4",  # tess_re, on PyPI as tesserae-engine (`import tess_re`; it was `import tre` before 0.6.0), pinned to the release the whole suite was run on. A new engine release is tried first, by the user: a new engine line is a new Tesserae line. PyPI's own `tre` is an unrelated regex library.
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "watchfiles>=1.0",
    "loguru>=0.7",
    "materialyoucolor>=3.0.4,<4",
]

[project.scripts]
tesserae = "tess_ui.cli:main"  # `tesserae new`, `tesserae add screen` (M67)

[project.urls]
Repository = "https://github.com/mindderivative/tess-ui"

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=8.0", "pyinstaller>=6.10", "jsonschema>=4.17", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/tess_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
